<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reports | Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="../css/admin.css">
</head>
<body class="admin-body">

<div class="sidebar-backdrop" id="sidebarBackdrop"></div>
<aside class="admin-sidebar" id="adminSidebar"></aside>

<main class="admin-main">
  <div class="admin-topbar">
    <div class="d-flex align-items-center gap-2">
      <button class="btn btn-outline-secondary btn-sm d-none admin-mobile-toggle" id="sidebarToggleBtn"><i class="bi bi-list"></i></button>
      <h1 id="adminPageTitle">Reports</h1>
    </div>
  </div>

  <div class="row g-3 mb-2" id="reportStatsRow"></div>

  <div class="row g-3">
    <div class="col-lg-6">
      <div class="panel">
        <div class="panel-title">Bookings by Status</div>
        <canvas id="statusChart" height="220"></canvas>
      </div>
    </div>
    <div class="col-lg-6">
      <div class="panel">
        <div class="panel-title">Most Popular Services</div>
        <canvas id="popularChart" height="220"></canvas>
      </div>
    </div>
  </div>

  <div class="panel">
    <div class="panel-title">Damaged / Missing Rental Items</div>
    <div class="table-wrap">
      <table class="admin-table">
        <thead><tr><th>Item</th><th>Code</th><th>Status</th></tr></thead>
        <tbody id="damagedBody"></tbody>
      </table>
    </div>
  </div>
</main>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="../js/config.js"></script>
<script src="../js/storage.js"></script>
<script src="../js/api.js"></script>
<script src="../js/bookings.js"></script>
<script src="../js/admin.js"></script>
<script>
$(function () {
  initAdminChrome('reports.html', 'Reports');
  const r = API.getReportStats();

  const $stats = $('#reportStatsRow').empty();
  [
    { label: "Total Bookings", value: r.total_bookings, icon: "bi-journal-check" },
    { label: "Total Revenue", value: BookingCalc.formatCurrency(r.total_revenue), icon: "bi-cash-stack" },
    { label: "Outstanding Balance", value: BookingCalc.formatCurrency(r.outstanding_balance), icon: "bi-hourglass-split", cls: "warn" },
    { label: "Damaged / Missing Items", value: r.damaged_or_missing, icon: "bi-exclamation-triangle", cls: "danger" }
  ].forEach(s => {
    $stats.append(`
      <div class="col-6 col-md-3">
        <div class="stat-card ${s.cls || ''}">
          <div class="stat-icon"><i class="bi ${s.icon}"></i></div>
          <div class="stat-label">${s.label}</div>
          <div class="stat-value">${s.value}</div>
        </div>
      </div>`);
  });

  new Chart(document.getElementById('statusChart'), {
    type: 'doughnut',
    data: {
      labels: ['Pending', 'Confirmed', 'Completed', 'Cancelled/Rejected'],
      datasets: [{
        data: [r.pending, r.confirmed, r.completed, r.cancelled],
        backgroundColor: ['#D9A441', '#2E6E5F', '#1F4E45', '#B0AC9E']
      }]
    },
    options: { plugins: { legend: { position: 'bottom' } } }
  });

  new Chart(document.getElementById('popularChart'), {
    type: 'bar',
    data: {
      labels: r.popular_services.map(s => s.name),
      datasets: [{
        label: 'Bookings',
        data: r.popular_services.map(s => s.count),
        backgroundColor: '#1F4E45'
      }]
    },
    options: { plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } } }
  });

  const items = API.getRentalItems().filter(i => ['Damaged', 'Missing'].includes(i.status));
  const $body = $('#damagedBody').empty();
  if (!items.length) $body.append('<tr><td colspan="3" class="text-center text-muted py-3">No damaged or missing items.</td></tr>');
  items.forEach(i => {
    $body.append(`<tr><td>${i.name}</td><td>${i.item_code}</td><td>${badgeStatus(i.status, CONFIG.inventoryStatusColors)}</td></tr>`);
  });
});
</script>
</body>
</html>
