<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Categories | Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="../css/admin.css">
</head>
<body class="admin-body">

<div class="sidebar-backdrop" id="sidebarBackdrop"></div>
<aside class="admin-sidebar" id="adminSidebar"></aside>

<main class="admin-main">
  <div class="admin-topbar">
    <div class="d-flex align-items-center gap-2">
      <button class="btn btn-outline-secondary btn-sm d-none admin-mobile-toggle" id="sidebarToggleBtn"><i class="bi bi-list"></i></button>
      <h1 id="adminPageTitle">Categories</h1>
    </div>
    <button class="btn btn-admin-primary" id="addCategoryBtn"><i class="bi bi-plus-lg"></i> Add Category</button>
  </div>

  <div class="panel">
    <div class="table-wrap">
      <table class="admin-table">
        <thead><tr><th>Name</th><th># Services</th><th>Status</th><th>Actions</th></tr></thead>
        <tbody id="categoriesBody"></tbody>
      </table>
    </div>
  </div>
</main>

<div class="modal fade" id="categoryFormModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-scrollable">
    <form class="modal-content" id="categoryForm">
      <div class="modal-header">
          <h5 class="modal-title" id="categoryFormTitle">Add Category</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="catId">
          <div class="mb-3">
            <label class="form-label">Category Name</label>
            <input type="text" class="form-control" id="catName" required>
          </div>
          <div class="mb-1">
            <label class="form-label">Status</label>
            <select class="form-select" id="catStatus">
              <option>Active</option>
              <option>Inactive</option>
            </select>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-admin-primary">Save</button>
        </div>
      </form>
    </div>
  </div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/config.js"></script>
<script src="../js/storage.js"></script>
<script src="../js/api.js"></script>
<script src="../js/admin.js"></script>
<script>
$(function () {
  initAdminChrome('categories.html', 'Categories');
  renderCategoriesTable();

  $('#addCategoryBtn').on('click', function () {
    $('#categoryForm')[0].reset();
    $('#catId').val('');
    $('#categoryFormTitle').text('Add Category');
    new bootstrap.Modal('#categoryFormModal').show();
  });

  $(document).on('click', '.js-edit-cat', function () {
    const c = API.getCategories().find(x => x.category_id === $(this).data('id'));
    if (!c) return;
    $('#catId').val(c.category_id);
    $('#catName').val(c.name);
    $('#catStatus').val(c.status);
    $('#categoryFormTitle').text('Edit Category');
    new bootstrap.Modal('#categoryFormModal').show();
  });

  $(document).on('click', '.js-delete-cat', function () {
    const id = $(this).data('id');
    const inUse = API.getServices().some(s => s.category_id === id);
    if (inUse) { alert('This category is used by one or more services. Reassign those services first.'); return; }
    confirmDelete('Delete this category?', function () {
      API.deleteCategory(id);
      renderCategoriesTable();
      showAdminToast('Category deleted', 'danger');
    });
  });

  $('#categoryForm').on('submit', function (e) {
    e.preventDefault();
    const id = $('#catId').val();
    const data = { name: $('#catName').val().trim(), status: $('#catStatus').val() };
    if (id) { API.updateCategory(id, data); showAdminToast('Category updated'); }
    else { API.createCategory(data); showAdminToast('Category added'); }
    bootstrap.Modal.getInstance(document.getElementById('categoryFormModal')).hide();
    renderCategoriesTable();
  });
});

function renderCategoriesTable() {
  const categories = API.getCategories();
  const services = API.getServices();
  const $body = $('#categoriesBody').empty();
  if (!categories.length) {
    $body.append('<tr><td colspan="4" class="text-center text-muted py-4">No categories yet.</td></tr>');
    return;
  }
  categories.forEach(c => {
    const count = services.filter(s => s.category_id === c.category_id).length;
    $body.append(`
      <tr>
        <td class="fw-semibold">${c.name}</td>
        <td>${count}</td>
        <td>${badgeStatus(c.status, { Active: 'success', Inactive: 'secondary' })}</td>
        <td>
          <button class="btn btn-sm btn-outline-secondary js-edit-cat" data-id="${c.category_id}"><i class="bi bi-pencil"></i></button>
          <button class="btn btn-sm btn-outline-danger js-delete-cat" data-id="${c.category_id}"><i class="bi bi-trash"></i></button>
        </td>
      </tr>`);
  });
}
</script>
</body>
</html>
