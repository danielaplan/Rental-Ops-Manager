<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Settings | Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="../css/admin.css">
</head>
<body class="admin-body">

<div class="sidebar-backdrop" id="sidebarBackdrop"></div>
<aside class="admin-sidebar" id="adminSidebar"></aside>

<main class="admin-main">
  <div class="admin-topbar">
    <div class="d-flex align-items-center gap-2">
      <button class="btn btn-outline-secondary btn-sm d-none admin-mobile-toggle" id="sidebarToggleBtn"><i class="bi bi-list"></i></button>
      <h1 id="adminPageTitle">Settings</h1>
    </div>
  </div>

  <form id="settingsForm">
    <div class="panel">
      <div class="panel-title">Business Settings</div>
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label">Business Name</label>
          <input type="text" class="form-control" id="sBusinessName">
        </div>
        <div class="col-md-6">
          <label class="form-label">Logo URL</label>
          <input type="text" class="form-control" id="sLogo">
        </div>
        <div class="col-md-6">
          <label class="form-label">Phone</label>
          <input type="text" class="form-control" id="sPhone">
        </div>
        <div class="col-md-6">
          <label class="form-label">Email</label>
          <input type="email" class="form-control" id="sEmail">
        </div>
        <div class="col-12">
          <label class="form-label">Address</label>
          <input type="text" class="form-control" id="sAddress">
        </div>
        <div class="col-md-6">
          <label class="form-label">Facebook</label>
          <input type="text" class="form-control" id="sFacebook">
        </div>
        <div class="col-md-6">
          <label class="form-label">Instagram</label>
          <input type="text" class="form-control" id="sInstagram">
        </div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-title">Booking Settings</div>
      <div class="row g-3">
        <div class="col-md-4">
          <label class="form-label">Minimum Booking Notice (days)</label>
          <input type="number" min="0" class="form-control" id="sNoticeDays">
        </div>
        <div class="col-md-4">
          <label class="form-label">Booking Hours — Open</label>
          <input type="time" class="form-control" id="sHoursOpen">
        </div>
        <div class="col-md-4">
          <label class="form-label">Booking Hours — Close</label>
          <input type="time" class="form-control" id="sHoursClose">
        </div>
        <div class="col-12">
          <label class="form-label">Cancellation Policy</label>
          <textarea class="form-control" id="sCancelPolicy" rows="3"></textarea>
        </div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-title">Appearance</div>
      <p class="text-muted small">Keep the site to 2–3 main colors for a clean, professional look.</p>
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label">Primary Color</label>
          <input type="color" class="form-control form-control-color" id="sPrimaryColor">
        </div>
        <div class="col-md-6">
          <label class="form-label">Accent Color</label>
          <input type="color" class="form-control form-control-color" id="sAccentColor">
        </div>
      </div>
      <p class="text-muted small mt-2 mb-0"><i class="bi bi-info-circle"></i> These colors are applied to the public website the next time it is loaded.</p>
    </div>

    <button type="submit" class="btn btn-admin-primary px-4 py-2"><i class="bi bi-save"></i> Save Settings</button>
  </form>
</main>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/config.js"></script>
<script src="../js/storage.js"></script>
<script src="../js/api.js"></script>
<script src="../js/admin.js"></script>
<script>
$(function () {
  initAdminChrome('settings.html', 'Settings');
  loadSettings();

  $('#settingsForm').on('submit', function (e) {
    e.preventDefault();
    API.updateSettings({
      business_name: $('#sBusinessName').val().trim(),
      logo: $('#sLogo').val().trim(),
      phone: $('#sPhone').val().trim(),
      email: $('#sEmail').val().trim(),
      address: $('#sAddress').val().trim(),
      facebook: $('#sFacebook').val().trim(),
      instagram: $('#sInstagram').val().trim(),
      min_booking_notice_days: Number($('#sNoticeDays').val() || 0),
      booking_hours_open: $('#sHoursOpen').val(),
      booking_hours_close: $('#sHoursClose').val(),
      cancellation_policy: $('#sCancelPolicy').val().trim(),
      primary_color: $('#sPrimaryColor').val(),
      accent_color: $('#sAccentColor').val()
    });
    showAdminToast('Settings saved');
  });
});

function loadSettings() {
  const s = API.getSettings();
  $('#sBusinessName').val(s.business_name);
  $('#sLogo').val(s.logo);
  $('#sPhone').val(s.phone);
  $('#sEmail').val(s.email);
  $('#sAddress').val(s.address);
  $('#sFacebook').val(s.facebook);
  $('#sInstagram').val(s.instagram);
  $('#sNoticeDays').val(s.min_booking_notice_days);
  $('#sHoursOpen').val(s.booking_hours_open);
  $('#sHoursClose').val(s.booking_hours_close);
  $('#sCancelPolicy').val(s.cancellation_policy);
  $('#sPrimaryColor').val(s.primary_color || '#1F4E45');
  $('#sAccentColor').val(s.accent_color || '#D9A441');
}
</script>
</body>
</html>
