<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gallery | Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="../css/admin.css">
</head>
<body class="admin-body">

<div class="sidebar-backdrop" id="sidebarBackdrop"></div>
<aside class="admin-sidebar" id="adminSidebar"></aside>

<main class="admin-main">
  <div class="admin-topbar">
    <div class="d-flex align-items-center gap-2">
      <button class="btn btn-outline-secondary btn-sm d-none admin-mobile-toggle" id="sidebarToggleBtn"><i class="bi bi-list"></i></button>
      <h1 id="adminPageTitle">Gallery</h1>
    </div>
    <button class="btn btn-admin-primary" id="addImageBtn"><i class="bi bi-plus-lg"></i> Add Image</button>
  </div>

  <div class="panel">
    <div class="row g-3" id="galleryGridAdmin"></div>
  </div>
</main>

<div class="modal fade" id="imageFormModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-scrollable">
    <form class="modal-content" id="imageForm">
      <div class="modal-header">
          <h5 class="modal-title" id="imageFormTitle">Add Image</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="imgId">
          <div class="mb-3">
            <label class="form-label">Title</label>
            <input type="text" class="form-control" id="imgTitle" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Image URL</label>
            <input type="text" class="form-control" id="imgUrl" placeholder="https://..." required>
          </div>
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="imgFeatured">
            <label class="form-check-label" for="imgFeatured">Featured (shown on homepage)</label>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-admin-primary">Save</button>
        </div>
      </form>
    </div>
  </div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/config.js"></script>
<script src="../js/storage.js"></script>
<script src="../js/api.js"></script>
<script src="../js/admin.js"></script>
<script>
$(function () {
  initAdminChrome('gallery.html', 'Gallery');
  renderGallery();

  $('#addImageBtn').on('click', function () {
    $('#imageForm')[0].reset();
    $('#imgId').val('');
    $('#imageFormTitle').text('Add Image');
    new bootstrap.Modal('#imageFormModal').show();
  });

  $(document).on('click', '.js-edit-img', function () {
    const img = API.getGallery().find(g => g.image_id === $(this).data('id'));
    if (!img) return;
    $('#imgId').val(img.image_id);
    $('#imgTitle').val(img.title);
    $('#imgUrl').val(img.image);
    $('#imgFeatured').prop('checked', !!img.featured);
    $('#imageFormTitle').text('Edit Image');
    new bootstrap.Modal('#imageFormModal').show();
  });

  $(document).on('click', '.js-delete-img', function () {
    const id = $(this).data('id');
    confirmDelete('Delete this gallery image?', function () {
      API.deleteGalleryImage(id);
      renderGallery();
      showAdminToast('Image deleted', 'danger');
    });
  });

  $('#imageForm').on('submit', function (e) {
    e.preventDefault();
    const id = $('#imgId').val();
    const data = { title: $('#imgTitle').val().trim(), image: $('#imgUrl').val().trim(), featured: $('#imgFeatured').is(':checked') };
    if (id) { API.updateGalleryImage(id, data); showAdminToast('Image updated'); }
    else { API.createGalleryImage(data); showAdminToast('Image added'); }
    bootstrap.Modal.getInstance(document.getElementById('imageFormModal')).hide();
    renderGallery();
  });
});

function renderGallery() {
  const images = API.getGallery();
  const $wrap = $('#galleryGridAdmin').empty();
  if (!images.length) {
    $wrap.append('<p class="text-muted">No images yet.</p>');
    return;
  }
  images.forEach(img => {
    $wrap.append(`
      <div class="col-md-4 col-sm-6">
        <div class="border rounded overflow-hidden">
          <img src="${img.image}" style="width:100%;height:160px;object-fit:cover;">
          <div class="p-2">
            <div class="d-flex justify-content-between align-items-center">
              <span class="fw-semibold small">${img.title}</span>
              ${img.featured ? '<span class="badge bg-warning text-dark">Featured</span>' : ''}
            </div>
            <div class="mt-2 d-flex gap-1">
              <button class="btn btn-sm btn-outline-secondary js-edit-img" data-id="${img.image_id}"><i class="bi bi-pencil"></i></button>
              <button class="btn btn-sm btn-outline-danger js-delete-img" data-id="${img.image_id}"><i class="bi bi-trash"></i></button>
            </div>
          </div>
        </div>
      </div>`);
  });
}
</script>
</body>
</html>
