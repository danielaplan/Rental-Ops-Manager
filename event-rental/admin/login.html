<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login | Fiesta &amp; Co.</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="../css/admin.css">
</head>
<body class="admin-body">

<div class="admin-login-wrap">
  <div class="admin-login-card">
    <div class="text-center mb-4">
      <i class="bi bi-shield-lock" style="font-size:2rem;color:var(--a-primary);"></i>
      <h1 class="mt-2 mb-0">Admin Panel</h1>
      <p class="text-muted small">Sign in to manage your rental business</p>
    </div>
    <form id="loginForm">
      <div class="mb-3">
        <label class="form-label">Username</label>
        <input type="text" class="form-control" id="loginUsername" value="admin" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" class="form-control" id="loginPassword" value="admin123" required>
      </div>
      <button type="submit" class="btn btn-admin-primary w-100 py-2">Log In</button>
      <p class="text-muted small text-center mt-3 mb-0">
        <i class="bi bi-info-circle"></i> Prototype login — any username/password works.
      </p>
    </form>
    <div class="text-center mt-3">
      <a href="../index.html" class="small text-muted"><i class="bi bi-arrow-left"></i> Back to website</a>
    </div>
  </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/config.js"></script>
<script src="../js/storage.js"></script>
<script src="../js/api.js"></script>
<script src="../js/admin.js"></script>
<script>
  $(function () {
    if (AdminAuth.isLoggedIn()) window.location.href = "dashboard.html";

    $('#loginForm').on('submit', function (e) {
      e.preventDefault();
      const username = $('#loginUsername').val().trim() || "admin";
      AdminAuth.login(username);
      window.location.href = "dashboard.html";
    });
  });
</script>
</body>
</html>
