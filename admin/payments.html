<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payments | Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="../css/admin.css">
</head>
<body class="admin-body">

<div class="sidebar-backdrop" id="sidebarBackdrop"></div>
<aside class="admin-sidebar" id="adminSidebar"></aside>

<main class="admin-main">
  <div class="admin-topbar">
    <div class="d-flex align-items-center gap-2">
      <button class="btn btn-outline-secondary btn-sm d-none admin-mobile-toggle" id="sidebarToggleBtn"><i class="bi bi-list"></i></button>
      <h1 id="adminPageTitle">Payments</h1>
    </div>
  </div>

  <div class="row g-3 mb-2" id="payStatsRow"></div>

  <div class="panel">
    <div class="panel-title">All Payments</div>
    <div class="table-wrap">
      <table class="admin-table">
        <thead><tr><th>Payment ID</th><th>Booking</th><th>Customer</th><th>Amount</th><th>Method</th><th>Date</th><th>Notes</th></tr></thead>
        <tbody id="paymentsBody"></tbody>
      </table>
    </div>
  </div>

  <div class="panel">
    <div class="panel-title">Outstanding Balances</div>
    <div class="table-wrap">
      <table class="admin-table">
        <thead><tr><th>Booking</th><th>Customer</th><th>Total</th><th>Paid</th><th>Balance</th><th>Status</th></tr></thead>
        <tbody id="outstandingBody"></tbody>
      </table>
    </div>
  </div>
</main>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/config.js"></script>
<script src="../js/storage.js"></script>
<script src="../js/api.js"></script>
<script src="../js/bookings.js"></script>
<script src="../js/payments.js"></script>
<script src="../js/admin.js"></script>
<script>
$(function () {
  initAdminChrome('payments.html', 'Payments');
  renderPayments();
});

function renderPayments() {
  const payments = API.getPayments().slice().sort((a, b) => (a.date < b.date ? 1 : -1));
  const bookings = API.getBookings();

  const totalCollected = payments.reduce((s, p) => s + Number(p.amount), 0);
  const totalOutstanding = bookings.reduce((s, b) => s + PaymentsHelper.remainingBalance(b), 0);
  const fullyPaidCount = bookings.filter(b => b.payment_status === 'Fully Paid').length;

  const $stats = $('#payStatsRow').empty();
  [
    { label: "Total Collected", value: BookingCalc.formatCurrency(totalCollected), icon: "bi-cash-stack" },
    { label: "Outstanding Balance", value: BookingCalc.formatCurrency(totalOutstanding), icon: "bi-hourglass-split", cls: "warn" },
    { label: "Fully Paid Bookings", value: fullyPaidCount, icon: "bi-check2-circle" },
    { label: "Total Payments Logged", value: payments.length, icon: "bi-receipt" }
  ].forEach(s => {
    $stats.append(`
      <div class="col-6 col-md-3">
        <div class="stat-card ${s.cls || ''}">
          <div class="stat-icon"><i class="bi ${s.icon}"></i></div>
          <div class="stat-label">${s.label}</div>
          <div class="stat-value">${s.value}</div>
        </div>
      </div>`);
  });

  const $body = $('#paymentsBody').empty();
  if (!payments.length) $body.append('<tr><td colspan="7" class="text-center text-muted py-4">No payments recorded yet.</td></tr>');
  payments.forEach(p => {
    const b = bookings.find(x => x.id === p.booking_id);
    $body.append(`
      <tr>
        <td>${p.payment_id}</td>
        <td>${p.booking_id}</td>
        <td>${b ? b.customer_name : '—'}</td>
        <td>${BookingCalc.formatCurrency(p.amount)}</td>
        <td>${p.method}</td>
        <td>${BookingCalc.formatDate(p.date)}</td>
        <td class="text-muted">${p.notes || ''}</td>
      </tr>`);
  });

  const outstanding = bookings.filter(b => PaymentsHelper.remainingBalance(b) > 0);
  const $out = $('#outstandingBody').empty();
  if (!outstanding.length) $out.append('<tr><td colspan="6" class="text-center text-muted py-4">No outstanding balances. 🎉</td></tr>');
  outstanding.forEach(b => {
    $out.append(`
      <tr>
        <td>${b.id}</td>
        <td>${b.customer_name}</td>
        <td>${BookingCalc.formatCurrency(b.total)}</td>
        <td>${BookingCalc.formatCurrency(b.amount_paid)}</td>
        <td class="fw-bold text-danger">${BookingCalc.formatCurrency(PaymentsHelper.remainingBalance(b))}</td>
        <td>${badgeStatus(b.payment_status, CONFIG.paymentStatusColors)}</td>
      </tr>`);
  });
}
</script>
</body>
</html>
