<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payments | Admin</title>
<link href="../vendor/fonts.css" rel="stylesheet">
<link href="../vendor/bootstrap-5.3.3.min.css" rel="stylesheet">
<link rel="stylesheet" href="../vendor/bootstrap-icons.css">
<link rel="stylesheet" href="../css/admin.css">
</head>
<body class="admin-body">

<div class="sidebar-backdrop" id="sidebarBackdrop"></div>
<aside class="admin-sidebar" id="adminSidebar"></aside>

<main class="admin-main">
  <div class="admin-topbar">
    <div class="d-flex align-items-center gap-2">
      <button class="btn btn-outline-secondary btn-sm d-none admin-mobile-toggle" id="sidebarToggleBtn"><i class="bi bi-list"></i></button>
      <h1 id="adminPageTitle">Payments</h1>
    </div>
  </div>

  <div class="row g-3 mb-2" id="payStatsRow"></div>

  <div class="panel">
    <div class="panel-title">All Payments</div>
    <div class="table-wrap">
      <table class="admin-table">
        <thead><tr><th>Payment ID</th><th>Booking</th><th>Customer</th><th>Amount</th><th>Method</th><th>Date</th><th>Notes</th><th>Sync</th></tr></thead>
        <tbody id="paymentsBody"></tbody>
      </table>
    </div>
  </div>

  <div class="panel">
    <div class="panel-title">Outstanding Balances</div>
    <div class="table-wrap">
      <table class="admin-table">
        <thead><tr><th>Booking</th><th>Customer</th><th>Total</th><th>Paid</th><th>Balance</th><th>Status</th></tr></thead>
        <tbody id="outstandingBody"></tbody>
      </table>
    </div>
  </div>
</main>

<script src="../vendor/jquery-3.7.1.min.js"></script>
<script src="../vendor/bootstrap-5.3.3.bundle.min.js"></script>
<script src="../js/config.js"></script>
<script src="../js/storage.js"></script>
<script src="../js/api.js"></script>
<script src="../js/sync.js"></script>
<script src="../js/bookings.js"></script>
<script src="../js/payments.js"></script>
<script src="../js/admin.js"></script>
<script src="../js/sync-ui.js"></script>
<script src="../js/offline.js"></script>
<script>
adminReady(async function () {
  await API.ready;
  await initAdminChrome('payments.html', 'Payments');
  await renderPayments();
});

async function renderPayments() {
  const [payments, bookings, pendingPaymentIndex] = await Promise.all([
    API.getPayments(),
    API.getBookings(),
    PaymentsHelper.pendingAmountsByBooking()
  ]);
  const sortedPayments = payments.slice().sort((a, b) => (a.date < b.date ? 1 : -1));

  const totalCollected = sortedPayments.filter(p => !p.pending_sync).reduce((s, p) => s + Number(p.amount), 0);
  const pendingAmount = sortedPayments.filter(p => p.pending_sync).reduce((s, p) => s + Number(p.amount), 0);
  const totalOutstanding = await bookings.reduce(async (sumPromise, b) => {
    const sum = await sumPromise;
    return sum + await PaymentsHelper.remainingBalance(b, pendingPaymentIndex);
  }, Promise.resolve(0));
  const fullyPaidCount = (await Promise.all(bookings.map(async b => ({
    booking: b,
    status: await PaymentsHelper.paymentStatus(b, pendingPaymentIndex)
  })))).filter(item => item.status === 'Fully Paid').length;

  const $stats = $('#payStatsRow').empty();
  [
    { label: "Total Collected", value: BookingCalc.formatCurrency(totalCollected), icon: "bi-cash-stack" },
    { label: "Pending Sync", value: BookingCalc.formatCurrency(pendingAmount), icon: "bi-cloud-arrow-up", cls: pendingAmount > 0 ? "warn" : "" },
    { label: "Outstanding Balance", value: BookingCalc.formatCurrency(totalOutstanding), icon: "bi-hourglass-split", cls: "warn" },
    { label: "Fully Paid Bookings", value: fullyPaidCount, icon: "bi-check2-circle" },
    { label: "Total Payments Logged", value: sortedPayments.length, icon: "bi-receipt" }
  ].forEach(s => {
    $stats.append(`
      <div class="col-6 col-md-3">
        <div class="stat-card ${s.cls || ''}">
          <div class="stat-icon"><i class="bi ${s.icon}"></i></div>
          <div class="stat-label">${s.label}</div>
          <div class="stat-value">${s.value}</div>
        </div>
      </div>`);
  });

  const $body = $('#paymentsBody').empty();
  if (!sortedPayments.length) $body.append('<tr><td colspan="8" class="text-center text-muted py-4">No payments recorded yet.</td></tr>');
  sortedPayments.forEach(p => {
    const b = bookings.find(x => x.id === p.booking_id);
    $body.append(`
      <tr>
        <td>${escapeHtmlA(p.payment_id)}</td>
        <td>${escapeHtmlA(p.booking_id)}</td>
        <td>${b ? escapeHtmlA(b.customer_name) : '—'}</td>
        <td>${BookingCalc.formatCurrency(p.amount)}</td>
        <td>${escapeHtmlA(PaymentsHelper.methodLabel(p.method))}</td>
        <td>${BookingCalc.formatDate(p.date)}</td>
        <td class="text-muted">${escapeHtmlA(p.notes || '')}</td>
        <td>${p.pending_sync ? '<span class="badge bg-warning text-dark">Pending Sync</span>' : '<span class="badge bg-success">Recorded</span>'}</td>
      </tr>`);
  });

  const outstanding = [];
  for (const b of bookings) {
    const balance = await PaymentsHelper.remainingBalance(b, pendingPaymentIndex);
    if (balance > 0) outstanding.push({ booking: b, balance, paid: await PaymentsHelper.acceptedAmountPaid(b, pendingPaymentIndex), status: await PaymentsHelper.paymentStatus(b, pendingPaymentIndex) });
  }
  const $out = $('#outstandingBody').empty();
  if (!outstanding.length) $out.append('<tr><td colspan="6" class="text-center text-muted py-4">No outstanding balances.</td></tr>');
  outstanding.forEach(item => {
    const b = item.booking;
    $out.append(`
      <tr>
        <td>${escapeHtmlA(b._server_id || b.id)}</td>
        <td>${escapeHtmlA(b.customer_name)}</td>
        <td>${BookingCalc.formatCurrency(b.total)}</td>
        <td>${BookingCalc.formatCurrency(item.paid)}</td>
        <td class="fw-bold text-danger">${BookingCalc.formatCurrency(item.balance)}</td>
        <td>${badgeStatus(item.status, CONFIG.paymentStatusColors)}</td>
      </tr>`);
  });
}
</script>
</body>
</html>
