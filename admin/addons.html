<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add-ons | Admin</title>
<link href="../vendor/fonts.css" rel="stylesheet">
<link href="../vendor/bootstrap-5.3.3.min.css" rel="stylesheet">
<link rel="stylesheet" href="../vendor/bootstrap-icons.css">
<link rel="stylesheet" href="../css/admin.css">
</head>
<body class="admin-body">

<div class="sidebar-backdrop" id="sidebarBackdrop"></div>
<aside class="admin-sidebar" id="adminSidebar"></aside>

<main class="admin-main">
  <div class="admin-topbar">
    <div class="d-flex align-items-center gap-2">
      <button class="btn btn-outline-secondary btn-sm d-none admin-mobile-toggle" id="sidebarToggleBtn"><i class="bi bi-list"></i></button>
      <h1 id="adminPageTitle">Add-ons</h1>
    </div>
    <button class="btn btn-admin-primary" id="addAddonBtn"><i class="bi bi-plus-lg"></i> Add Add-on</button>
  </div>

  <div class="panel">
    <div class="table-wrap">
      <table class="admin-table">
        <thead><tr><th>Name</th><th>Service</th><th>Price</th><th>Status</th><th>Actions</th></tr></thead>
        <tbody id="addonsBody"></tbody>
      </table>
    </div>
  </div>
</main>

<div class="modal fade" id="addonFormModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-scrollable">
    <form class="modal-content" id="addonForm">
      <div class="modal-header">
          <h5 class="modal-title" id="addonFormTitle">Add Add-on</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="addonId">
          <div class="mb-3">
            <label class="form-label" for="addonService">Belongs to Service</label>
            <select class="form-select" id="addonService" required></select>
          </div>
          <div class="mb-3">
            <label class="form-label" for="addonName">Add-on Name</label>
            <input type="text" class="form-control" id="addonName" required>
          </div>
          <div class="mb-3">
            <label class="form-label" for="addonPrice">Price (₱)</label>
            <input type="number" min="0" class="form-control" id="addonPrice" required>
          </div>
          <div class="mb-1">
            <label class="form-label" for="addonStatus">Status</label>
            <select class="form-select" id="addonStatus">
              <option>Active</option>
              <option>Inactive</option>
            </select>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-admin-primary">Save</button>
        </div>
      </form>
    </div>
  </div>

<script src="../vendor/jquery-3.7.1.min.js"></script>
<script src="../vendor/bootstrap-5.3.3.bundle.min.js"></script>
<script src="../js/config.js"></script>
<script src="../js/storage.js"></script>
<script src="../js/api.js"></script>
<script src="../js/sync.js"></script>
<script src="../js/bookings.js"></script>
<script src="../js/admin.js"></script>
<script src="../js/sync-ui.js"></script>
<script src="../js/offline.js"></script>
<script>
$(async function () {
  await API.ready;
  initAdminChrome('addons.html', 'Add-ons');
  populateServiceSelect();
  renderAddonsTable();

  $('#addAddonBtn').on('click', function () {
    $('#addonForm')[0].reset();
    $('#addonId').val('');
    $('#addonFormTitle').text('Add Add-on');
    new bootstrap.Modal('#addonFormModal').show();
  });

  $(document).on('click', '.js-edit-addon', function () {
    const a = API.getAddons().find(x => x.addon_id === $(this).data('id'));
    if (!a) return;
    $('#addonId').val(a.addon_id);
    $('#addonService').val(a.service_id);
    $('#addonName').val(a.name);
    $('#addonPrice').val(a.price);
    $('#addonStatus').val(a.status);
    $('#addonFormTitle').text('Edit Add-on');
    new bootstrap.Modal('#addonFormModal').show();
  });

  $(document).on('click', '.js-delete-addon', function () {
    const id = $(this).data('id');
    confirmDelete('Delete this add-on?', function () {
      API.deleteAddon(id);
      renderAddonsTable();
      showAdminToast('Add-on deleted', 'danger');
    });
  });

  $(document).on('change', '.js-toggle-addon-status', function () {
    API.updateAddon($(this).data('id'), { status: this.checked ? 'Active' : 'Inactive' });
    showAdminToast('Add-on status updated');
  });

  $('#addonForm').on('submit', function (e) {
    e.preventDefault();
    const id = $('#addonId').val();
    const data = {
      service_id: $('#addonService').val(),
      name: $('#addonName').val().trim(),
      price: Number($('#addonPrice').val()),
      status: $('#addonStatus').val()
    };
    if (id) { API.updateAddon(id, data); showAdminToast('Add-on updated'); }
    else { API.createAddon(data); showAdminToast('Add-on added'); }
    bootstrap.Modal.getInstance(document.getElementById('addonFormModal')).hide();
    renderAddonsTable();
  });
});

function populateServiceSelect() {
  const $sel = $('#addonService').empty();
  API.getServices().forEach(s => $sel.append(`<option value="${s.service_id}">${s.name}</option>`));
}

function renderAddonsTable() {
  const addons = API.getAddons();
  const services = API.getServices();
  const $body = $('#addonsBody').empty();
  if (!addons.length) {
    $body.append('<tr><td colspan="5" class="text-center text-muted py-4">No add-ons yet.</td></tr>');
    return;
  }
  addons.forEach(a => {
    const svc = services.find(s => s.service_id === a.service_id);
    $body.append(`
      <tr>
        <td class="fw-semibold">${a.name}</td>
        <td>${svc ? svc.name : '<span class="text-muted">Unknown</span>'}</td>
        <td>${BookingCalc.formatCurrency(a.price)}</td>
        <td>
          <div class="form-check form-switch">
            <input class="form-check-input js-toggle-addon-status" type="checkbox" data-id="${a.addon_id}" ${a.status === 'Active' ? 'checked' : ''}>
          </div>
        </td>
        <td>
          <button class="btn btn-sm btn-outline-secondary js-edit-addon" data-id="${a.addon_id}"><i class="bi bi-pencil"></i></button>
          <button class="btn btn-sm btn-outline-danger js-delete-addon" data-id="${a.addon_id}"><i class="bi bi-trash"></i></button>
        </td>
      </tr>`);
  });
}
</script>
</body>
</html>
