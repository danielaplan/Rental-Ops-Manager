<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Owner Accounts | Admin</title><link href="../vendor/fonts.css" rel="stylesheet"><link href="../vendor/bootstrap-5.3.3.min.css" rel="stylesheet"><link rel="stylesheet" href="../vendor/bootstrap-icons.css"><link rel="stylesheet" href="../css/admin.css"></head>
<body class="admin-body"><div class="sidebar-backdrop" id="sidebarBackdrop"></div><aside class="admin-sidebar" id="adminSidebar"></aside>
<main class="admin-main"><div class="admin-topbar"><div class="d-flex align-items-center gap-2"><button class="btn btn-outline-secondary btn-sm d-none admin-mobile-toggle" id="sidebarToggleBtn" aria-label="Toggle admin navigation" aria-controls="adminSidebar" aria-expanded="false"><i class="bi bi-list"></i></button><h1 id="adminPageTitle">Owner Accounts</h1></div><button class="btn btn-admin-primary" id="addOwnerBtn"><i class="bi bi-person-plus"></i> Add Owner</button></div>
<div class="alert alert-info">Only the primary owner can manage the second owner account. Deactivation and password reset revoke that owner's active sessions.</div>
<div class="panel"><div class="table-wrap"><table class="admin-table"><thead><tr><th>Owner</th><th>Username</th><th>Contact</th><th>Access</th><th>Status</th><th>Actions</th></tr></thead><tbody id="ownersBody"></tbody></table></div></div></main>
<div class="modal fade" id="ownerModal" tabindex="-1"><div class="modal-dialog"><form class="modal-content" id="ownerForm"><div class="modal-header"><h5 class="modal-title">Add second owner</h5><button class="btn-close" type="button" data-bs-dismiss="modal" aria-label="Close"></button></div><div class="modal-body"><div class="mb-3"><label class="form-label" for="ownerName">Full name</label><input class="form-control" id="ownerName" maxlength="100" required></div><div class="mb-3"><label class="form-label" for="ownerUsername">Username</label><input class="form-control" id="ownerUsername" pattern="[A-Za-z0-9_.-]+" maxlength="100" required></div><div class="mb-3"><label class="form-label" for="ownerContact">Contact number</label><input class="form-control" id="ownerContact" maxlength="20"></div><div><label class="form-label" for="ownerPassword">Temporary password</label><input type="password" class="form-control" id="ownerPassword" minlength="8" maxlength="72" required></div></div><div class="modal-footer"><button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button><button type="submit" class="btn btn-admin-primary">Create Owner</button></div></form></div></div>
<script src="../vendor/jquery-3.7.1.min.js"></script><script src="../vendor/bootstrap-5.3.3.bundle.min.js"></script><script src="../js/config.js"></script><script src="../js/storage.js"></script><script src="../js/api.js"></script><script src="../js/sync.js"></script><script src="../js/bookings.js"></script><script src="../js/admin.js"></script><script src="../js/sync-ui.js"></script><script src="../js/offline.js"></script>
<script>
let ownerRows = [];
adminReady(async function () {
  await API.ready; await initAdminChrome('owners.html', 'Owner Accounts'); await renderOwners();
  $('#addOwnerBtn').onAdmin('click', () => { $('#ownerForm')[0].reset(); new bootstrap.Modal('#ownerModal').show(); });
  $('#ownerForm').onAdmin('submit', async function (event) { event.preventDefault(); const button=$(this).find('[type=submit]').prop('disabled',true); try { await API.createOwner({full_name:$('#ownerName').val().trim(),username:$('#ownerUsername').val().trim(),contact_number:$('#ownerContact').val().trim()||null,password:$('#ownerPassword').val()}); bootstrap.Modal.getInstance(document.getElementById('ownerModal')).hide(); await renderOwners(); showAdminToast('Owner account created.'); } catch(error){showAdminToast(error.message,'danger');} finally{button.prop('disabled',false);} });
  $('.admin-main').onAdmin('click','.js-owner-status',async function(){const id=$(this).data('id'), active=$(this).data('active')===1; try{await API.setOwnerActive(id,active);await renderOwners();showAdminToast(active?'Owner reactivated.':'Owner deactivated.');}catch(error){showAdminToast(error.message,'danger');}});
  $('.admin-main').onAdmin('click','.js-owner-password',async function(){const password=prompt('Enter a new password (8–72 characters):');if(password===null)return;try{await API.resetOwnerPassword($(this).data('id'),password);showAdminToast('Password reset and active sessions revoked.');}catch(error){showAdminToast(error.message,'danger');}});
});
async function renderOwners(){ownerRows=await API.getOwners();$('#addOwnerBtn').prop('disabled',ownerRows.length>=2);const body=$('#ownersBody').empty();ownerRows.forEach(owner=>{const primary=Boolean(Number(owner.is_primary_owner)),active=owner.account_status==='Active';body.append(`<tr><td class="fw-semibold">${escapeHtmlA(owner.full_name)}</td><td>${escapeHtmlA(owner.username)}</td><td>${escapeHtmlA(owner.contact_number||'—')}</td><td>${primary?'<span class="badge bg-primary">Primary owner</span>':'Owner'}</td><td>${badgeStatus(owner.account_status)}</td><td>${primary?'—':`<button class="btn btn-sm btn-outline-secondary js-owner-password" data-id="${owner.user_id}">Reset password</button> <button class="btn btn-sm ${active?'btn-outline-danger':'btn-outline-success'} js-owner-status" data-id="${owner.user_id}" data-active="${active?0:1}">${active?'Deactivate':'Reactivate'}</button>`}</td></tr>`);});}
</script></body></html>
