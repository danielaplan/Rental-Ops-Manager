<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Customers | Admin</title>
<link href="../vendor/fonts.css" rel="stylesheet">
<link href="../vendor/bootstrap-5.3.3.min.css" rel="stylesheet">
<link rel="stylesheet" href="../vendor/bootstrap-icons.css">
<link rel="stylesheet" href="../css/admin.css">
</head>
<body class="admin-body">

<div class="sidebar-backdrop" id="sidebarBackdrop"></div>
<aside class="admin-sidebar" id="adminSidebar"></aside>

<main class="admin-main">
  <div class="admin-topbar">
    <div class="d-flex align-items-center gap-2">
      <button class="btn btn-outline-secondary btn-sm d-none admin-mobile-toggle" id="sidebarToggleBtn" aria-label="Toggle admin navigation" aria-controls="adminSidebar" aria-expanded="false"><i class="bi bi-list"></i></button>
      <h1 id="adminPageTitle">Customers</h1>
    </div>
  </div>

  <div class="panel">
    <input type="text" class="form-control form-control-sm mb-3" style="max-width:260px;" id="custSearch" placeholder="Search name, contact, or email..." aria-label="Search customers">
    <div class="table-wrap">
      <table class="admin-table">
        <thead><tr><th>Name</th><th>Contact</th><th>Email</th><th>Type</th><th># Bookings</th><th>Total Spent</th></tr></thead>
        <tbody id="customersBody"></tbody>
      </table>
    </div>
  </div>
</main>

<script src="../vendor/jquery-3.7.1.min.js"></script>
<script src="../vendor/bootstrap-5.3.3.bundle.min.js"></script>
<script src="../js/config.js"></script>
<script src="../js/storage.js"></script>
<script src="../js/api.js"></script>
<script src="../js/sync.js"></script>
<script src="../js/bookings.js"></script>
<script src="../js/customers.js"></script>
<script src="../js/admin.js"></script>
<script src="../js/sync-ui.js"></script>
<script src="../js/offline.js"></script>
<script>
adminReady(async function () {
  await API.ready;
  await initAdminChrome('customers.html', 'Customers');
  await renderCustomers();
  $('#custSearch').onAdmin('input', async function () { await renderCustomers($(this).val()); });
});

async function renderCustomers(query) {
  const version = ++CustomersHelper.renderVersion;
  const customers = await CustomersHelper.search(query, version);
  if (version !== CustomersHelper.renderVersion) return;
  const $body = $('#customersBody').empty();
  if (!customers.length) {
    $body.append('<tr><td colspan="6" class="text-center text-muted py-4">No customers found.</td></tr>');
    return;
  }
  customers.forEach(c => {
    $body.append(`
      <tr>
        <td class="fw-semibold">${escapeHtmlA(c.name)}</td>
        <td>${escapeHtmlA(c.contact)}</td>
        <td>${c.email ? escapeHtmlA(c.email) : '<span class="text-muted">—</span>'}</td>
        <td><span class="badge bg-light text-dark border">${escapeHtmlA(c.type)}</span></td>
        <td>${c.bookings_count}</td>
        <td>${BookingCalc.formatCurrency(c.total_spent)}</td>
      </tr>`);
  });
}
</script>
</body>
</html>
