<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Website Content | Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="../css/admin.css">
</head>
<body class="admin-body">

<div class="sidebar-backdrop" id="sidebarBackdrop"></div>
<aside class="admin-sidebar" id="adminSidebar"></aside>

<main class="admin-main">
  <div class="admin-topbar">
    <div class="d-flex align-items-center gap-2">
      <button class="btn btn-outline-secondary btn-sm d-none admin-mobile-toggle" id="sidebarToggleBtn"><i class="bi bi-list"></i></button>
      <h1 id="adminPageTitle">Website Content</h1>
    </div>
    <a href="../index.html" target="_blank" class="btn btn-outline-secondary btn-sm"><i class="bi bi-box-arrow-up-right"></i> View Website</a>
  </div>

  <form id="contentForm">
    <div class="panel">
      <div class="panel-title">Business</div>
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label">Business Name</label>
          <input type="text" class="form-control" id="cBusinessName">
        </div>
        <div class="col-md-6">
          <label class="form-label">Logo URL (optional)</label>
          <input type="text" class="form-control" id="cLogo">
        </div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-title">Hero Section</div>
      <div class="row g-3">
        <div class="col-12">
          <label class="form-label">Title</label>
          <input type="text" class="form-control" id="cHeroTitle">
        </div>
        <div class="col-12">
          <label class="form-label">Description</label>
          <textarea class="form-control" id="cHeroDesc" rows="2"></textarea>
        </div>
        <div class="col-md-8">
          <label class="form-label">Hero Image URL</label>
          <input type="text" class="form-control" id="cHeroImage">
        </div>
        <div class="col-md-4">
          <label class="form-label">Button Text</label>
          <input type="text" class="form-control" id="cHeroBtn">
        </div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-title">About Section</div>
      <div class="row g-3">
        <div class="col-12">
          <label class="form-label">Title</label>
          <input type="text" class="form-control" id="cAboutTitle">
        </div>
        <div class="col-12">
          <label class="form-label">Description</label>
          <textarea class="form-control" id="cAboutDesc" rows="3"></textarea>
        </div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-title">Contact Section</div>
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label">Phone</label>
          <input type="text" class="form-control" id="cPhone">
        </div>
        <div class="col-md-6">
          <label class="form-label">Email</label>
          <input type="email" class="form-control" id="cEmail">
        </div>
        <div class="col-12">
          <label class="form-label">Address</label>
          <input type="text" class="form-control" id="cAddress">
        </div>
        <div class="col-md-6">
          <label class="form-label">Facebook URL</label>
          <input type="text" class="form-control" id="cFacebook">
        </div>
        <div class="col-md-6">
          <label class="form-label">Instagram URL</label>
          <input type="text" class="form-control" id="cInstagram">
        </div>
      </div>
    </div>

    <button type="submit" class="btn btn-admin-primary px-4 py-2"><i class="bi bi-save"></i> Save Website Content</button>
  </form>
</main>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/config.js"></script>
<script src="../js/storage.js"></script>
<script src="../js/api.js"></script>
<script src="../js/admin.js"></script>
<script>
$(function () {
  initAdminChrome('content.html', 'Website Content');
  loadContent();

  $('#contentForm').on('submit', function (e) {
    e.preventDefault();
    API.updateWebsiteContent({
      business_name: $('#cBusinessName').val().trim(),
      logo: $('#cLogo').val().trim(),
      hero_title: $('#cHeroTitle').val().trim(),
      hero_description: $('#cHeroDesc').val().trim(),
      hero_image: $('#cHeroImage').val().trim(),
      hero_button_text: $('#cHeroBtn').val().trim(),
      about_title: $('#cAboutTitle').val().trim(),
      about_description: $('#cAboutDesc').val().trim(),
      contact_phone: $('#cPhone').val().trim(),
      contact_email: $('#cEmail').val().trim(),
      contact_address: $('#cAddress').val().trim(),
      contact_facebook: $('#cFacebook').val().trim(),
      contact_instagram: $('#cInstagram').val().trim()
    });
    showAdminToast('Website content updated. Changes are live on the public site.');
  });
});

function loadContent() {
  const c = API.getWebsiteContent();
  $('#cBusinessName').val(c.business_name);
  $('#cLogo').val(c.logo);
  $('#cHeroTitle').val(c.hero_title);
  $('#cHeroDesc').val(c.hero_description);
  $('#cHeroImage').val(c.hero_image);
  $('#cHeroBtn').val(c.hero_button_text);
  $('#cAboutTitle').val(c.about_title);
  $('#cAboutDesc').val(c.about_description);
  $('#cPhone').val(c.contact_phone);
  $('#cEmail').val(c.contact_email);
  $('#cAddress').val(c.contact_address);
  $('#cFacebook').val(c.contact_facebook);
  $('#cInstagram').val(c.contact_instagram);
}
</script>
</body>
</html>
