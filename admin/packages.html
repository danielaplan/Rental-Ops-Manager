<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Packages & Checklists | Admin</title><link href="../vendor/fonts.css" rel="stylesheet"><link href="../vendor/bootstrap-5.3.3.min.css" rel="stylesheet"><link rel="stylesheet" href="../vendor/bootstrap-icons.css"><link rel="stylesheet" href="../css/admin.css"></head>
<body class="admin-body"><div class="sidebar-backdrop" id="sidebarBackdrop"></div><aside class="admin-sidebar" id="adminSidebar"></aside>
<main class="admin-main"><div class="admin-topbar"><div class="d-flex align-items-center gap-2"><button class="btn btn-outline-secondary btn-sm d-none admin-mobile-toggle" id="sidebarToggleBtn" aria-label="Toggle admin navigation" aria-controls="adminSidebar" aria-expanded="false"><i class="bi bi-list"></i></button><h1 id="adminPageTitle">Packages & Checklists</h1></div><button class="btn btn-admin-primary" id="addPackageBtn"><i class="bi bi-plus-lg"></i> Add Package</button></div>
<div class="panel"><div class="table-wrap"><table class="admin-table"><thead><tr><th>Package</th><th>Service</th><th>Price</th><th>Duration</th><th>Promotion</th><th>Status</th><th>Checklist</th><th>Actions</th></tr></thead><tbody id="packagesBody"></tbody></table></div></div></main>

<div class="modal fade" id="packageModal" tabindex="-1"><div class="modal-dialog modal-lg modal-dialog-scrollable"><form class="modal-content" id="packageForm"><div class="modal-header"><h5 class="modal-title" id="packageTitle">Add package</h5><button class="btn-close" type="button" data-bs-dismiss="modal" aria-label="Close"></button></div><div class="modal-body"><input type="hidden" id="packageId"><div class="row g-3">
<div class="col-md-6"><label class="form-label" for="packageName">Package name</label><input class="form-control" id="packageName" maxlength="100" required></div><div class="col-md-6"><label class="form-label" for="packageService">Service</label><select class="form-select" id="packageService" required></select></div>
<div class="col-12"><label class="form-label" for="packageDescription">Description</label><textarea class="form-control" id="packageDescription" rows="2"></textarea></div><div class="col-12"><label class="form-label" for="packageInclusions">Inclusions</label><textarea class="form-control" id="packageInclusions" rows="2"></textarea></div>
<div class="col-md-4"><label class="form-label" for="packagePrice">Price</label><input type="number" min="0" step="0.01" class="form-control" id="packagePrice" required></div><div class="col-md-4"><label class="form-label" for="packageDuration">Duration (minutes)</label><input type="number" min="0" step="1" class="form-control" id="packageDuration" value="0" required></div><div class="col-md-4"><label class="form-label" for="packageStatus">Status</label><select class="form-select" id="packageStatus"><option>Active</option><option>Inactive</option></select></div>
<div class="col-md-4"><div class="form-check mt-4"><input class="form-check-input" type="checkbox" id="packageDeposit"><label class="form-check-label" for="packageDeposit">Requires deposit</label></div></div><div class="col-md-4"><label class="form-label" for="packageDepositAmount">Deposit amount</label><input type="number" min="0" step="0.01" class="form-control" id="packageDepositAmount" value="0"></div><div class="col-md-4"><div class="form-check mt-4"><input class="form-check-input" type="checkbox" id="packagePromotional"><label class="form-check-label" for="packagePromotional">Promotional package</label></div></div>
<div class="col-md-6"><label class="form-label" for="packagePromoStart">Promotion starts</label><input type="date" class="form-control" id="packagePromoStart"></div><div class="col-md-6"><label class="form-label" for="packagePromoEnd">Promotion ends</label><input type="date" class="form-control" id="packagePromoEnd"></div>
</div></div><div class="modal-footer"><button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button><button type="submit" class="btn btn-admin-primary">Save Package</button></div></form></div></div>

<div class="modal fade" id="templateModal" tabindex="-1"><div class="modal-dialog modal-lg modal-dialog-scrollable"><form class="modal-content" id="templateForm"><div class="modal-header"><div><h5 class="modal-title">New checklist version</h5><div class="small text-muted" id="templatePackageName"></div></div><button class="btn-close" type="button" data-bs-dismiss="modal" aria-label="Close"></button></div><div class="modal-body"><input type="hidden" id="templatePackageId"><div class="mb-3"><label class="form-label" for="templateName">Template name</label><input class="form-control" id="templateName" maxlength="150" required></div><div class="d-flex justify-content-between align-items-center mb-2"><strong>Items</strong><button type="button" class="btn btn-sm btn-outline-secondary" id="addTemplateItem"><i class="bi bi-plus"></i> Add item</button></div><div id="templateItems"></div><div class="small text-muted">Existing versions stay unchanged for historical bookings. Deactivate the active version before creating its replacement.</div></div><div class="modal-footer"><button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button><button type="submit" class="btn btn-admin-primary">Create Version</button></div></form></div></div>

<script src="../vendor/jquery-3.7.1.min.js"></script><script src="../vendor/bootstrap-5.3.3.bundle.min.js"></script><script src="../js/config.js"></script><script src="../js/storage.js"></script><script src="../js/api.js"></script><script src="../js/sync.js"></script><script src="../js/bookings.js"></script><script src="../js/admin.js"></script><script src="../js/sync-ui.js"></script><script src="../js/offline.js"></script>
<script>
let packageRows=[], serviceRows=[], templateRows=[];
adminReady(async function(){await API.ready;await initAdminChrome('packages.html','Packages & Checklists');await API.refreshSharedData();await loadPackages();
$('#addPackageBtn').onAdmin('click',()=>openPackage());
$('.admin-main').onAdmin('click','.js-edit-package',function(){openPackage(packageRows.find(row=>String(row.package_id)===String($(this).data('id'))));});
$('.admin-main').onAdmin('click','.js-archive-package',async function(){if(!confirm('Deactivate this package? Existing bookings retain their saved package details.'))return;try{await API.deletePackage($(this).data('id'));await loadPackages();showAdminToast('Package deactivated.');}catch(error){showAdminToast(error.message,'danger');}});
$('.admin-main').onAdmin('click','.js-template-package',function(){const row=packageRows.find(item=>String(item.package_id)===String($(this).data('id')));$('#templateForm')[0].reset();$('#templatePackageId').val(row.package_id);$('#templatePackageName').text(row.name);$('#templateItems').empty();addTemplateItem();new bootstrap.Modal('#templateModal').show();});
$('.admin-main').onAdmin('click','.js-template-toggle',async function(){try{await API.updateChecklistTemplate($(this).data('id'),{status:$(this).data('active')===1?'Active':'Inactive'});await loadPackages();showAdminToast('Checklist template updated.');}catch(error){showAdminToast(error.message,'danger');}});
$('#addTemplateItem').onAdmin('click',addTemplateItem);$('#templateItems').onAdmin('click','.js-remove-template-item',function(){$(this).closest('.template-item').remove();});
$('#packagePromotional').onAdmin('change',togglePromotionFields);
$('#packageForm').onAdmin('submit',savePackage);$('#templateForm').onAdmin('submit',saveTemplate);
});
async function loadPackages(){[packageRows,serviceRows,templateRows]=await Promise.all([API.getPackages(),API.getServices(),API.getChecklistTemplates()]);const select=$('#packageService').empty();serviceRows.forEach(row=>select.append(`<option value="${row.service_id}">${escapeHtmlA(row.name||row.service_name)}</option>`));renderPackages();}
function promotionLabel(row){if(row.status!=='Active')return['Inactive','secondary'];if(!Number(row.is_promotional))return['Regular','success'];const today=new Date().toISOString().slice(0,10);if(today<row.promotion_start_date)return['Upcoming promotion','info'];if(today>row.promotion_end_date)return['Expired','secondary'];return['Active promotion','warning'];}
function renderPackages(){const services=new Map(serviceRows.map(row=>[String(row.service_id),row.name||row.service_name]));const body=$('#packagesBody').empty();if(!packageRows.length)return body.append('<tr><td colspan="8" class="text-center text-muted py-4">No packages yet.</td></tr>');packageRows.forEach(row=>{const label=promotionLabel(row),templates=templateRows.filter(t=>String(t.package_id)===String(String(row.package_id).replace(/^PKG-0*/,'')));const templateHtml=templates.length?templates.map(t=>`<div class="small mb-1"><span class="badge ${t.status==='Active'?'bg-success':'bg-secondary'}">${escapeHtmlA(t.status)}</span> ${escapeHtmlA(t.template_name)} (${t.items?.length||0}) <button class="btn btn-link btn-sm p-0 js-template-toggle" data-id="${t.template_id}" data-active="${t.status==='Active'?0:1}">${t.status==='Active'?'Deactivate':'Activate'}</button></div>`).join(''):'<span class="text-muted small">No template</span>';body.append(`<tr><td><strong>${escapeHtmlA(row.name||row.package_name)}</strong><div class="small text-muted">${escapeHtmlA(row.description||'')}</div></td><td>${escapeHtmlA(services.get(String(row.service_id))||row.service_id)}</td><td>${BookingCalc.formatCurrency(row.price)}</td><td>${Number(row.duration_minutes||0)} min</td><td><span class="badge bg-${label[1]}">${label[0]}</span></td><td>${badgeStatus(row.status)}</td><td>${templateHtml}<button class="btn btn-sm btn-outline-secondary js-template-package mt-1" data-id="${row.package_id}">New version</button></td><td><button class="btn btn-sm btn-outline-secondary js-edit-package" data-id="${row.package_id}" aria-label="Edit package"><i class="bi bi-pencil"></i></button> <button class="btn btn-sm btn-outline-danger js-archive-package" data-id="${row.package_id}" aria-label="Deactivate package"><i class="bi bi-archive"></i></button></td></tr>`);});}
function openPackage(row){$('#packageForm')[0].reset();$('#packageId').val(row?.package_id||'');$('#packageTitle').text(row?'Edit package':'Add package');$('#packageName').val(row?.name||row?.package_name||'');$('#packageService').val(row?.service_id||serviceRows[0]?.service_id);$('#packageDescription').val(row?.description||'');$('#packageInclusions').val(row?.inclusions||'');$('#packagePrice').val(row?.price??'');$('#packageDuration').val(row?.duration_minutes||0);$('#packageStatus').val(row?.status||'Active');$('#packageDeposit').prop('checked',Boolean(Number(row?.requires_deposit)));$('#packageDepositAmount').val(row?.deposit_amount||0);$('#packagePromotional').prop('checked',Boolean(Number(row?.is_promotional)));$('#packagePromoStart').val(row?.promotion_start_date||'');$('#packagePromoEnd').val(row?.promotion_end_date||'');togglePromotionFields();new bootstrap.Modal('#packageModal').show();}
function togglePromotionFields(){const on=$('#packagePromotional').is(':checked');$('#packagePromoStart,#packagePromoEnd').prop('required',on).prop('disabled',!on);}
async function savePackage(event){event.preventDefault();const id=$('#packageId').val(),data={package_name:$('#packageName').val().trim(),service_id:$('#packageService').val(),description:$('#packageDescription').val().trim(),inclusions:$('#packageInclusions').val().trim(),price:$('#packagePrice').val(),duration_minutes:Number($('#packageDuration').val()),status:$('#packageStatus').val(),requires_deposit:$('#packageDeposit').is(':checked')?1:0,deposit_amount:$('#packageDepositAmount').val()||0,is_promotional:$('#packagePromotional').is(':checked')?1:0,promotion_start_date:$('#packagePromotional').is(':checked')?$('#packagePromoStart').val():null,promotion_end_date:$('#packagePromotional').is(':checked')?$('#packagePromoEnd').val():null};const button=$(event.currentTarget).find('[type=submit]').prop('disabled',true);try{id?await API.updatePackage(id,data):await API.createPackage(data);bootstrap.Modal.getInstance(document.getElementById('packageModal')).hide();await loadPackages();showAdminToast('Package saved.');}catch(error){showAdminToast(error.message,'danger');}finally{button.prop('disabled',false);}}
function addTemplateItem(){ $('#templateItems').append('<div class="row g-2 mb-2 template-item"><div class="col-8"><input class="form-control js-item-name" maxlength="100" placeholder="Item name" required></div><div class="col-3"><input type="number" min="0" step="1" class="form-control js-item-quantity" value="1" aria-label="Expected quantity" required></div><div class="col-1"><button type="button" class="btn btn-outline-danger js-remove-template-item" aria-label="Remove item">×</button></div></div>');}
async function saveTemplate(event){event.preventDefault();const items=$('.template-item').map(function(){return{item_name:$(this).find('.js-item-name').val().trim(),expected_quantity:Number($(this).find('.js-item-quantity').val())};}).get();if(!items.length)return showAdminToast('Add at least one checklist item.','danger');const button=$(event.currentTarget).find('[type=submit]').prop('disabled',true);try{await API.createChecklistTemplate({package_id:$('#templatePackageId').val(),template_name:$('#templateName').val().trim(),items});bootstrap.Modal.getInstance(document.getElementById('templateModal')).hide();await loadPackages();showAdminToast('Checklist version created.');}catch(error){showAdminToast(error.message,'danger');}finally{button.prop('disabled',false);}}
</script></body></html>
