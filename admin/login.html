<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login | AKAD Sweet Party Rentals</title>
<link href="../vendor/fonts.css" rel="stylesheet">
<link href="../vendor/bootstrap-5.3.3.min.css" rel="stylesheet">
<link rel="stylesheet" href="../vendor/bootstrap-icons.css">
<link rel="stylesheet" href="../css/admin.css">
</head>
<body class="admin-body">

<div class="admin-login-wrap">
  <div class="admin-login-card">
    <div class="text-center mb-4">
      <i class="bi bi-shield-lock" style="font-size:2rem;color:var(--a-primary);"></i>
      <h1 class="mt-2 mb-0">Admin Panel</h1>
      <p class="text-muted small">Sign in to manage your rental business</p>
    </div>
    <form id="loginForm">
      <div class="mb-3">
        <label class="form-label" for="loginUsername">Contact number</label>
        <input type="text" class="form-control" id="loginUsername" autocomplete="username" required>
      </div>
      <div class="mb-3">
        <label class="form-label" for="loginPassword">Password</label>
        <input type="password" class="form-control" id="loginPassword" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn btn-admin-primary w-100 py-2">Log In</button>
      <p class="text-muted small text-center mt-3 mb-0"><i class="bi bi-info-circle"></i> First sign-in requires an internet connection.</p>
    </form>
    <div class="text-center mt-3">
      <a href="../index.html" class="small text-muted"><i class="bi bi-arrow-left"></i> Back to website</a>
    </div>
  </div>
</div>

<script src="../vendor/jquery-3.7.1.min.js"></script>
<script src="../vendor/bootstrap-5.3.3.bundle.min.js"></script>
<script src="../js/config.js"></script>
<script src="../js/storage.js"></script>
<script src="../js/api.js"></script>
<script src="../js/sync.js"></script>
<script src="../js/admin.js"></script>
<script src="../js/sync-ui.js"></script>
<script src="../js/offline.js"></script>
<script>
  $(function () {
    // Fix #1: Never auto-redirect based on localStorage alone.
    // Verify with PHP first — only redirect if the server confirms the token is still valid.
    if (AdminAuth.isLoggedIn()) {
      AdminAuth.verifyWithServer().then(valid => {
        if (valid) window.location.href = 'dashboard.html';
      });
    }

    $('#loginForm').onAdmin('submit', async function (e) {
      e.preventDefault();
      // Fix #2: No silent fallback — blank contact number is a real error.
      const username = $('#loginUsername').val().trim();
      const password = $('#loginPassword').val();
      if (!username) {
        alert('Please enter your contact number.');
        return;
      }
      await AdminAuth.login(username, password);
      window.location.href = 'dashboard.html';
    });
  });
</script>
</body>
</html>
