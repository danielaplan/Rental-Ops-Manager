<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manual Booking | Admin</title>
<link href="../vendor/fonts.css" rel="stylesheet">
<link href="../vendor/bootstrap-5.3.3.min.css" rel="stylesheet">
<link rel="stylesheet" href="../vendor/bootstrap-icons.css">
<link rel="stylesheet" href="../css/admin.css">
</head>
<body class="admin-body">

<div class="sidebar-backdrop" id="sidebarBackdrop"></div>
<aside class="admin-sidebar" id="adminSidebar"></aside>

<main class="admin-main">
  <div class="admin-topbar">
    <div class="d-flex align-items-center gap-2">
      <button class="btn btn-outline-secondary btn-sm d-none admin-mobile-toggle" id="sidebarToggleBtn"><i class="bi bi-list"></i></button>
      <h1 id="adminPageTitle">Manual Booking</h1>
    </div>
  </div>

  <p class="text-muted">For customers without an account — Facebook Messenger, phone calls, SMS, referrals, or walk-ins.</p>

  <div class="panel">
    <form id="manualBookingForm">
      <div class="manual-booking-layout">
        <div class="row g-4 manual-booking-top">
          <div class="col-lg-5 manual-booking-section">
            <h6 class="manual-section-title">1. Customer Details</h6>
          <div class="row g-3 mb-3">
            <div class="col-12">
              <label class="form-label" for="mCustName">Full Name</label>
              <input type="text" class="form-control" id="mCustName" required>
            </div>
            <div class="col-12">
              <label class="form-label" for="mCustContact">Contact Number</label>
              <input type="text" class="form-control" id="mCustContact" required>
            </div>
            <div class="col-12">
              <label class="form-label" for="mCustEmail">Email (optional)</label>
              <input type="email" class="form-control" id="mCustEmail">
            </div>
            <div class="col-12">
              <label class="form-label" for="mCustType">Customer Type</label>
              <select class="form-select" id="mCustType">
                <option>Guest / No Account</option>
                <option>Registered</option>
              </select>
            </div>
            <div class="col-12">
              <label class="form-label" for="mSource">Booking Source</label>
              <select class="form-select" id="mSource">
                <option>Manual</option>
                <option>Facebook Messenger</option>
                <option>Phone Call</option>
                <option>SMS</option>
                <option>Referral</option>
                <option>Walk-in</option>
              </select>
            </div>
          </div>
          </div>

          <div class="col-lg-7 manual-booking-section">
            <h6 class="manual-section-title">2. Event Details</h6>
            <div class="row g-3 mb-2">
              <div class="col-md-4">
                <label class="form-label" for="mDate">Event Date</label>
                <input type="date" class="form-control" id="mDate" required>
              </div>
              <div class="col-md-4">
                <label class="form-label" for="mStart">Start Time</label>
                <input type="time" class="form-control" id="mStart" required>
              </div>
              <div class="col-md-4">
                <label class="form-label" for="mEnd">End Time</label>
                <input type="time" class="form-control" id="mEnd" required>
              </div>
            </div>
            <div class="mb-3" id="mAvailabilityStatus"></div>

            <div class="row g-3 mb-3">
              <div class="col-md-6">
                <label class="form-label" for="mEventType">Event Type</label>
                <select class="form-select" id="mEventType" required></select>
              </div>
              <div class="col-md-6">
                <label class="form-label" for="mGuests">Number of Guests</label>
                <input type="number" min="1" class="form-control" id="mGuests">
              </div>
              <div class="col-12">
                <label class="form-label" for="mLocation">Event Location</label>
                <input type="text" class="form-control" id="mLocation" required>
              </div>
              <div class="col-12">
                <label class="form-label" for="mSpecialRequests">Special Requests</label>
                <textarea class="form-control" id="mSpecialRequests" rows="2"></textarea>
              </div>
            </div>
          </div>
        </div>

        <div class="manual-booking-section manual-booking-services">
          <h6 class="manual-section-title">3. Select Service and Package</h6>
          <div class="row g-2 mb-3" id="mServiceChecklist"></div>
<label for="mPackage" class="form-label">Package</label><select id="mPackage" class="form-select mb-3" required><option value="">Select a service first</option></select>
<div id="manualSaveError" class="alert alert-danger" role="alert" tabindex="-1" hidden></div>

          <div id="mAddonSection" style="display:none;">
            <h6 class="manual-section-title">4. Optional Add-ons</h6>
            <div class="row g-2 mb-3" id="mAddonChecklist"></div>
          </div>
        </div>

        <div class="manual-booking-section manual-booking-payment">
          <h6 class="manual-section-title">5. Pricing &amp; Payment</h6>
          <div class="row g-4 align-items-start">
            <div class="col-lg-7">
          <div class="row g-3 mb-3">
            <div class="col-6">
              <label class="form-label" for="mDiscount">Discount (₱)</label>
              <input type="number" min="0" class="form-control" id="mDiscount" value="0">
            </div>
            <div class="col-6">
              <label class="form-label" for="mFees">Additional Fees (₱)</label>
              <input type="number" min="0" class="form-control" id="mFees" value="0">
            </div>
            <div class="col-6">
              <label class="form-label" for="mAmountPaid">Agreed down payment paid now (₱)</label>
              <input type="number" min="0" class="form-control" id="mAmountPaid" value="0">
            </div>
            <div class="col-6">
              <label class="form-label" for="mPayMethod">Payment Method</label>
              <select class="form-select" id="mPayMethod"></select>
            </div>
          </div>
            </div>

            <div class="col-lg-5">
              <div class="summary-box mb-3">
            <div class="summary-row"><span>Subtotal</span><span id="mSumSubtotal">₱0</span></div>
            <div class="summary-row"><span>Add-ons</span><span id="mSumAddons">₱0</span></div>
            <div class="summary-row"><span>Discount</span><span id="mSumDiscount">-₱0</span></div>
            <div class="summary-row"><span>Fees</span><span id="mSumFees">₱0</span></div>
            <div class="summary-row total"><span>Total</span><span id="mSumTotal">₱0</span></div>
              </div>

              <button type="submit" class="btn btn-admin-primary w-100 py-2" id="mSubmitBtn">
                <i class="bi bi-check2-circle"></i> Create Booking
              </button>
            </div>
          </div>
        </div>
      </div>
    </form>
  </div>
</main>

<script src="../vendor/jquery-3.7.1.min.js"></script>
<script src="../vendor/bootstrap-5.3.3.bundle.min.js"></script>
<script src="../js/config.js"></script>
<script src="../js/storage.js"></script>
<script src="../js/api.js"></script>
<script src="../js/sync.js"></script>
<script src="../js/bookings.js"></script>
<script src="../js/payments.js"></script>
<script src="../js/admin.js"></script>
<script src="../js/sync-ui.js"></script>
<script src="../js/offline.js"></script>
<script>
$(async function () {
  await API.ready;
  initAdminChrome('manual-booking.html', 'Manual Booking');
  await API.refreshSharedData();
  populateForm();
  restoreManualDraft();

  $(document).on('change', '.js-m-service', function () {
    $(this).closest('.service-check-card').toggleClass('selected', this.checked);
    renderPackages();
    renderAddons();
    updateSummary();
    checkAvailability();
  });
  $(document).on('change', '.js-m-addon, #mDate, #mStart, #mEnd, #mPackage', function () {
    updateSummary();
    checkAvailability();
  });

  $('#manualBookingForm').on('submit', function (e) {
    e.preventDefault();
    createManualBooking();
  });
});

function populateForm() {
  const services = API.getActiveServices();
  const $wrap = $('#mServiceChecklist').empty();
  services.forEach(s => {
    $wrap.append(`
      <div class="col-md-6">
        <label class="service-check-card d-flex align-items-center gap-2 mb-0">
          <input type="radio" name="service" class="js-m-service form-check-input mt-0" value="${s.service_id}">
          <span class="flex-fill"><strong>${s.name}</strong><br><small class="text-muted">Select a package below</small></span>
        </label>
      </div>`);
  });

  const $evt = $('#mEventType').empty();
  CONFIG.eventTypes.forEach(t => $evt.append(`<option>${t}</option>`));

  const $pm = $('#mPayMethod').empty();
  CONFIG.paymentMethods.forEach(m => $pm.append(`<option>${m}</option>`));
}

function renderPackages() {
  const service=getMSelectedServices()[0];
  const packages=API.getPackages().filter(p=>p.service_id===service);
  $('#mPackage').html('<option value="">Choose a package</option>'+packages.map(p=>'<option value="'+p.package_id+'">'+escapeHtmlA(p.package_name)+' — '+BookingCalc.formatCurrency(p.price)+'</option>').join(''));
}
function manualTotals(addonIds,discount,fees) {
  const p=API.getPackages().find(p=>String(p.package_id)===$('#mPackage').val());
  const subtotal=Number(p?.price||0),addonsTotal=API.getAddons().filter(a=>addonIds.includes(a.addon_id)).reduce((sum,a)=>sum+Number(a.price),0);
  return {subtotal,addonsTotal,total:Math.max(0,subtotal+addonsTotal-discount+fees)};
}
function manualDraftKey(){return 'er_manual_draft_'+STORAGE._get(STORAGE_KEYS.adminSession,{})?.user?.user_id;}
function restoreManualDraft(){
 const draft=STORAGE._get(manualDraftKey(),{});
 if(draft.service){$('.js-m-service').filter((i,el)=>el.value===draft.service).prop('checked',true);renderPackages();renderAddons();}
 Object.entries(draft).forEach(([id,value])=>{if(id!=='service')$('#'+id).val(value);});updateSummary();checkAvailability();
}
$(document).off('input.manualDraft change.manualDraft','#manualBookingForm :input').on('input.manualDraft change.manualDraft','#manualBookingForm :input',()=>{
 const draft={service:getMSelectedServices()[0]};$('#manualBookingForm [id]').each(function(){if(this.matches('input,select,textarea'))draft[this.id]=$(this).val();});STORAGE._set(manualDraftKey(),draft);
});
function getMSelectedServices() { return $('.js-m-service:checked').map(function () { return this.value; }).get(); }
function getMSelectedAddons() { return $('.js-m-addon:checked').map(function () { return this.value; }).get(); }

function renderAddons() {
  const serviceIds = getMSelectedServices();
  const $wrap = $('#mAddonChecklist').empty();
  let addons = [];
  serviceIds.forEach(id => { addons = addons.concat(API.getAddonsForService(id)); });
  if (!addons.length) { $('#mAddonSection').hide(); return; }
  $('#mAddonSection').show();
  addons.forEach(a => {
    $wrap.append(`
      <div class="col-md-6">
        <label class="d-flex align-items-center gap-2">
          <input type="checkbox" class="js-m-addon form-check-input mt-0" value="${a.addon_id}">
          <span>${a.name} — ${BookingCalc.formatCurrency(a.price)}</span>
        </label>
      </div>`);
  });
}

function updateSummary() {
  const serviceIds = getMSelectedServices();
  const addonIds = getMSelectedAddons();
  const discount = Number($('#mDiscount').val() || 0);
  const fees = Number($('#mFees').val() || 0);
  const { subtotal, addonsTotal, total } = manualTotals(addonIds, discount, fees);
  $('#mSumSubtotal').text(BookingCalc.formatCurrency(subtotal));
  $('#mSumAddons').text(BookingCalc.formatCurrency(addonsTotal));
  $('#mSumDiscount').text('-' + BookingCalc.formatCurrency(discount));
  $('#mSumFees').text(BookingCalc.formatCurrency(fees));
  $('#mSumTotal').text(BookingCalc.formatCurrency(total));
}
$(document).on('input', '#mDiscount, #mFees', updateSummary);

function checkAvailability() {
  const serviceIds = getMSelectedServices();
  const date = $('#mDate').val(), start = $('#mStart').val(), end = $('#mEnd').val();
  const $status = $('#mAvailabilityStatus');
  if (!serviceIds.length || !date || !start || !end) { $status.html(''); return; }
  if (start >= end) {
    $status.html('<span class="availability-pill unavailable"><i class="bi bi-exclamation-circle"></i> End time must be after start time</span>');
    $('#mSubmitBtn').prop('disabled', true);
    return;
  }
  const conflicts = serviceIds.filter(id => !API.checkAvailability(id, date, start, end).available);
  if (conflicts.length) {
    $status.html('<span class="availability-pill unavailable"><i class="bi bi-x-circle"></i> Already Booked / Unavailable</span>');
    $('#mSubmitBtn').prop('disabled', true);
  } else {
    $status.html('<span class="availability-pill available"><i class="bi bi-check-circle"></i> Available</span>');
    $('#mSubmitBtn').prop('disabled', false);
  }
}

/* Independent time validation — runs at submission, not just on change.
   The availability pill alone does not prevent a reversed/equal range
   from being saved, because the overlap math treats equal times as free. */
function validateBookingTimes(date, start, end) {
  if (!date || !start || !end) return { ok: false, message: 'Date, start time, and end time are required.' };
  if (start >= end) return { ok: false, message: 'End time must be after start time.' };
  return { ok: true, message: '' };
}

function createManualBooking() {
  const serviceIds = getMSelectedServices();
  if (serviceIds.length!==1 || !$('#mPackage').val()) { showFieldError('#mPackage','Select one service and its package.'); return; }
  const date = $('#mDate').val(), start = $('#mStart').val(), end = $('#mEnd').val();

  const timeCheck = validateBookingTimes(date, start, end);
  if (!timeCheck.ok) { showFieldError('#mEnd', timeCheck.message); return; }
  clearFieldError('#mEnd');

  const conflicts = serviceIds.filter(id => !API.checkAvailability(id, date, start, end).available);
  if (conflicts.length) { alert('One of the selected services is unavailable for that date/time.'); return; }

  const addonIds = getMSelectedAddons();
  const discount = Number($('#mDiscount').val() || 0);
  const fees = Number($('#mFees').val() || 0);
  const { subtotal, addonsTotal, total } = manualTotals(addonIds, discount, fees);
  const amountPaid = Number($('#mAmountPaid').val() || 0);

  $('#mSubmitBtn').prop('disabled',true);
  try {
  const booking = API.createBooking({
    customer_name: $('#mCustName').val().trim(),
    contact: $('#mCustContact').val().trim(),
    email: $('#mCustEmail').val().trim(),
    customer_type: $('#mCustType').val(),
    event_type: $('#mEventType').val(),
    event_date: date, start_time: start, end_time: end,
    location: $('#mLocation').val().trim(),
    guests: Number($('#mGuests').val() || 0),
    special_requests: $('#mSpecialRequests').val().trim(),
    service_ids: serviceIds, package_id: Number($('#mPackage').val()),
    addon_ids: addonIds,
    discount, fees,
    subtotal, addons_total: addonsTotal, total,
    amount_paid: 0,
    status: "Pending",
    source: $('#mSource').val()
  });

  if (amountPaid > 0) {
    PaymentsHelper.recordPayment(booking.id, amountPaid, $('#mPayMethod').val(), 'Negotiated down payment at booking creation');
  }

  localStorage.removeItem(manualDraftKey());
  showAdminToast(API.savedMessage());
  window.location.href = 'bookings.html';
  } catch(error) { $('#manualSaveError').prop('hidden',false).text(error.message).trigger('focus'); $('#mSubmitBtn').prop('disabled',false); }
}
</script>
</body>
</html>
