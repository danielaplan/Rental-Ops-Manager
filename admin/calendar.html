<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calendar | Admin</title>
<link href="../vendor/fonts.css" rel="stylesheet">
<link href="../vendor/bootstrap-5.3.3.min.css" rel="stylesheet">
<link rel="stylesheet" href="../vendor/bootstrap-icons.css">
<link rel="stylesheet" href="../css/admin.css">
</head>
<body class="admin-body">

<div class="sidebar-backdrop" id="sidebarBackdrop"></div>
<aside class="admin-sidebar" id="adminSidebar"></aside>

<main class="admin-main">
  <div class="admin-topbar">
    <div class="d-flex align-items-center gap-2">
      <button class="btn btn-outline-secondary btn-sm d-none admin-mobile-toggle" id="sidebarToggleBtn"><i class="bi bi-list"></i></button>
      <h1 id="adminPageTitle">Calendar</h1>
    </div>
    <a href="manual-booking.html" class="btn btn-admin-accent"><i class="bi bi-plus-lg"></i> Create Manual Booking</a>
  </div>

  <div class="panel">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <button class="btn btn-outline-secondary btn-sm" id="prevMonthBtn"><i class="bi bi-chevron-left"></i></button>
      <h5 class="mb-0 js-calendar-label"></h5>
      <button class="btn btn-outline-secondary btn-sm" id="nextMonthBtn"><i class="bi bi-chevron-right"></i></button>
    </div>
    <div id="calendarWrap"></div>
  </div>
</main>

<!-- Quick booking peek modal -->
<div class="modal fade" id="calBookingModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Booking Details</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body" id="calBookingBody"></div>
      <div class="modal-footer">
        <a href="bookings.html" class="btn btn-admin-primary">Open in Bookings</a>
      </div>
    </div>
  </div>
</div>

<script src="../vendor/jquery-3.7.1.min.js"></script>
<script src="../vendor/bootstrap-5.3.3.bundle.min.js"></script>
<script src="../js/config.js"></script>
<script src="../js/storage.js"></script>
<script src="../js/api.js"></script>
<script src="../js/sync.js"></script>
<script src="../js/bookings.js"></script>
<script src="../js/calendar.js"></script>
<script src="../js/admin.js"></script>
<script src="../js/sync-ui.js"></script>
<script src="../js/offline.js"></script>
<script>
adminReady(async function () {
  await API.ready;
  await initAdminChrome('calendar.html', 'Calendar');
  await CalendarHelper.render('#calendarWrap', showBookingPeek);

  $('#prevMonthBtn').onAdmin('click', async function () { CalendarHelper.prevMonth(); await CalendarHelper.render('#calendarWrap', showBookingPeek); });
  $('#nextMonthBtn').onAdmin('click', async function () { CalendarHelper.nextMonth(); await CalendarHelper.render('#calendarWrap', showBookingPeek); });
});

let peekVersion = 0;
async function showBookingPeek(bookingId) {
  const version = ++peekVersion;
  const [b, services] = await Promise.all([API.getBooking(bookingId), API.getServices()]);
  if (!b || version !== peekVersion) return;
  const svcNames = (b.service_ids || []).map(id => (services.find(s => s.service_id === id) || {}).name).filter(Boolean).join(', ');
  $('#calBookingBody').html(`
    <p class="mb-1"><strong>${escapeHtmlA(b._server_id || b.id)}</strong> — ${badgeStatus(escapeHtmlA(b.status), CONFIG.bookingStatusColors)}</p>
    <p class="mb-1">${escapeHtmlA(b.customer_name)} — ${escapeHtmlA(b.contact)}</p>
    <p class="mb-1">${BookingCalc.formatDate(b.event_date)}, ${BookingCalc.formatTime(b.start_time)}–${BookingCalc.formatTime(b.end_time)}</p>
    <p class="mb-1">${escapeHtmlA(b.location)}</p>
    <p class="mb-0 text-muted">${escapeHtmlA(svcNames)}</p>
  `);
  new bootstrap.Modal('#calBookingModal').show();
}
</script>
</body>
</html>
