<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inventory | Admin</title>
<link href="../vendor/fonts.css" rel="stylesheet">
<link href="../vendor/bootstrap-5.3.3.min.css" rel="stylesheet">
<link rel="stylesheet" href="../vendor/bootstrap-icons.css">
<link rel="stylesheet" href="../css/admin.css">
</head>
<body class="admin-body">

<div class="sidebar-backdrop" id="sidebarBackdrop"></div>
<aside class="admin-sidebar" id="adminSidebar"></aside>

<main class="admin-main">
  <div class="admin-topbar">
    <div class="d-flex align-items-center gap-2">
      <button class="btn btn-outline-secondary btn-sm d-none admin-mobile-toggle" id="sidebarToggleBtn"><i class="bi bi-list"></i></button>
      <h1 id="adminPageTitle">Inventory</h1>
    </div>
    <button class="btn btn-admin-primary" id="addItemBtn"><i class="bi bi-plus-lg"></i> Add Rental Item</button>
  </div>

  <div class="row g-3 mb-2" id="invStatsRow"></div>

  <div class="panel">
    <div class="d-flex justify-content-between align-items-center mb-2 flex-wrap gap-2">
      <div class="panel-title mb-0">All Rental Items</div>
      <input type="text" class="form-control form-control-sm" style="max-width:220px;" id="invSearch" placeholder="Search item or code...">
    </div>
    <div class="table-wrap">
      <table class="admin-table">
        <thead><tr>
          <th>Item</th><th>Item Code</th><th>Service</th><th>Qty</th><th>Status</th><th>Condition</th><th>Actions</th>
        </tr></thead>
        <tbody id="inventoryBody"></tbody>
      </table>
    </div>
  </div>

  <div class="panel">
    <div class="panel-title">Items Requiring Attention</div>
    <div class="table-wrap">
      <table class="admin-table">
        <thead><tr><th>Item</th><th>Code</th><th>Status</th><th>Notes</th></tr></thead>
        <tbody id="attentionBody"></tbody>
      </table>
    </div>
  </div>
</main>

<!-- ADD/EDIT ITEM MODAL -->
<div class="modal fade" id="itemFormModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-scrollable">
    <form class="modal-content" id="itemForm">
      <div class="modal-header">
        <h5 class="modal-title" id="itemFormTitle">Add Rental Item</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
          <input type="hidden" id="itemId">
          <div class="row g-3">
            <div class="col-12">
              <label class="form-label" for="itemService">Belongs to Service</label>
              <select class="form-select" id="itemService" required></select>
            </div>
            <div class="col-md-8">
              <label class="form-label" for="itemName">Item Name</label>
              <input type="text" class="form-control" id="itemName" required>
            </div>
            <div class="col-md-4">
              <label class="form-label" for="itemCode">Item Code</label>
              <input type="text" class="form-control" id="itemCode" required>
            </div>
            <div class="col-md-6">
              <label class="form-label" for="itemQty">Quantity</label>
              <input type="number" min="1" class="form-control" id="itemQty" required>
            </div>
            <div class="col-md-6">
              <label class="form-label" for="itemTracking">Tracking Type</label>
              <select class="form-select" id="itemTracking">
                <option value="quantity">Quantity-based</option>
                <option value="individual">Individually tracked</option>
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label" for="itemStatus">Status</label>
              <select class="form-select" id="itemStatus"></select>
            </div>
            <div class="col-md-6">
              <label class="form-label" for="itemCondition">Condition</label>
              <select class="form-select" id="itemCondition"></select>
            </div>
            <div class="col-md-6">
              <div class="form-check mt-4">
                <input class="form-check-input" type="checkbox" id="itemRequired">
                <label class="form-check-label" for="itemRequired">Required for release</label>
              </div>
            </div>
            <div class="col-12">
              <label class="form-label" for="itemNotes">Notes</label>
              <input type="text" class="form-control" id="itemNotes">
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-admin-primary">Save Item</button>
        </div>
      </form>
    </div>
  </div>

<!-- HISTORY MODAL -->
<div class="modal fade" id="historyModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Rental / Return History</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body" id="historyBody"></div>
    </div>
  </div>
</div>

<script src="../vendor/jquery-3.7.1.min.js"></script>
<script src="../vendor/bootstrap-5.3.3.bundle.min.js"></script>
<script src="../js/config.js"></script>
<script src="../js/storage.js"></script>
<script src="../js/api.js"></script>
<script src="../js/sync.js"></script>
<script src="../js/bookings.js"></script>
<script src="../js/admin.js"></script>
<script src="../js/sync-ui.js"></script>
<script src="../js/offline.js"></script>
<script>
$(async function () {
  await API.ready;
  initAdminChrome('inventory.html', 'Inventory');
  populateItemSelects();
  renderInventory();

  $('#invSearch').on('input', function () { renderInventory($(this).val()); });

  $('#addItemBtn').on('click', function () {
    $('#itemForm')[0].reset();
    $('#itemId').val('');
    $('#itemFormTitle').text('Add Rental Item');
    new bootstrap.Modal('#itemFormModal').show();
  });

  $(document).on('click', '.js-edit-item', function () {
    const it = API.getRentalItems().find(x => x.rental_item_id === $(this).data('id'));
    if (!it) return;
    $('#itemId').val(it.rental_item_id);
    $('#itemService').val(it.service_id);
    $('#itemName').val(it.name);
    $('#itemCode').val(it.item_code);
    $('#itemQty').val(it.quantity);
    $('#itemTracking').val(it.tracking);
    $('#itemStatus').val(it.status);
    $('#itemCondition').val(it.condition);
    $('#itemRequired').prop('checked', !!it.required);
    $('#itemNotes').val(it.notes);
    $('#itemFormTitle').text('Edit Rental Item');
    new bootstrap.Modal('#itemFormModal').show();
  });

  $(document).on('click', '.js-delete-item', function () {
    const id = $(this).data('id');
    confirmDelete('Delete this rental item from the catalog?', function () {
      API.deleteRentalItem(id);
      renderInventory();
      showAdminToast('Rental item deleted', 'danger');
    });
  });

  $(document).on('click', '.js-view-history', function () {
    const id = $(this).data('id');
    const item = API.getRentalItems().find(x => x.rental_item_id === id);
    const history = API.getItemHistory(id);
    let html = `<h6>${item ? item.name : ''}</h6>`;
    if (!history.length) {
      html += '<p class="text-muted">No rental/return history yet.</p>';
    } else {
      html += '<ul class="list-unstyled">' + history.map(h => `
        <li class="border-bottom py-2">
          <strong>${new Date(h.date).toLocaleDateString('en-PH')}</strong> — ${h.booking_id} —
          ${h.action} <span class="badge bg-secondary">${h.condition || ''}</span>
        </li>`).join('') + '</ul>';
    }
    $('#historyBody').html(html);
    new bootstrap.Modal('#historyModal').show();
  });

  $('#itemForm').on('submit', function (e) {
    e.preventDefault();
    const id = $('#itemId').val();
    const data = {
      service_id: $('#itemService').val(),
      name: $('#itemName').val().trim(),
      item_code: $('#itemCode').val().trim(),
      quantity: Number($('#itemQty').val()),
      tracking: $('#itemTracking').val(),
      status: $('#itemStatus').val(),
      condition: $('#itemCondition').val(),
      required: $('#itemRequired').is(':checked'),
      notes: $('#itemNotes').val().trim()
    };
    if (id) { API.updateRentalItem(id, data); showAdminToast('Item updated'); }
    else { API.createRentalItem(data); showAdminToast('Item added'); }
    bootstrap.Modal.getInstance(document.getElementById('itemFormModal')).hide();
    renderInventory();
  });
});

function populateItemSelects() {
  const $svc = $('#itemService').empty();
  API.getServices().forEach(s => $svc.append(`<option value="${s.service_id}">${s.name}</option>`));

  const $status = $('#itemStatus').empty();
  CONFIG.inventoryStatuses.forEach(s => $status.append(`<option>${s}</option>`));

  const $cond = $('#itemCondition').empty();
  CONFIG.itemConditions.forEach(c => $cond.append(`<option>${c}</option>`));
}

function renderInventory(search) {
  const items = API.getRentalItems();
  const services = API.getServices();
  const bookingItems = STORAGE.getAll('bookingItems');

  // stats
  const statCount = (status) => items.filter(i => i.status === status).length;
  const stats = [
    { label: "Total Items", value: items.length, icon: "bi-clipboard-data" },
    { label: "Available", value: statCount("Available"), icon: "bi-check-circle" },
    { label: "Reserved", value: statCount("Reserved"), icon: "bi-bookmark" },
    { label: "On Rental", value: statCount("On Rental") + statCount("Released"), icon: "bi-truck" },
    { label: "Damaged", value: statCount("Damaged"), icon: "bi-exclamation-triangle", cls: "danger" },
    { label: "Maintenance", value: statCount("Under Maintenance"), icon: "bi-tools", cls: "warn" },
    { label: "Missing", value: statCount("Missing"), icon: "bi-question-circle", cls: "danger" }
  ];
  const $stats = $('#invStatsRow').empty();
  stats.forEach(s => {
    $stats.append(`
      <div class="col-6 col-md-4 col-xl-3">
        <div class="stat-card ${s.cls || ''}">
          <div class="stat-icon"><i class="bi ${s.icon}"></i></div>
          <div class="stat-label">${s.label}</div>
          <div class="stat-value">${s.value}</div>
        </div>
      </div>`);
  });

  let filtered = items;
  if (search) {
    const q = search.toLowerCase();
    filtered = items.filter(i => i.name.toLowerCase().includes(q) || (i.item_code || '').toLowerCase().includes(q));
  }

  const $body = $('#inventoryBody').empty();
  if (!filtered.length) {
    $body.append('<tr><td colspan="7" class="text-center text-muted py-4">No rental items found.</td></tr>');
  }
  filtered.forEach(i => {
    const svc = services.find(s => s.service_id === i.service_id);
    // find current booking if any active booking item references this rental item and is not returned
    const activeBI = bookingItems.find(bi => bi.rental_item_id === i.rental_item_id && bi.checked_released && bi.returned_qty === 0);
    $body.append(`
      <tr>
        <td class="fw-semibold">${i.name} ${i.required ? '<span class="text-danger" title="Required">*</span>' : ''}</td>
        <td>${i.item_code}</td>
        <td>${svc ? svc.name : '<span class="text-muted">Unassigned</span>'}</td>
        <td>${i.quantity}</td>
        <td>${badgeStatus(i.status, CONFIG.inventoryStatusColors)}</td>
        <td>${i.condition}</td>
        <td>
          <button class="btn btn-sm btn-outline-secondary js-edit-item" data-id="${i.rental_item_id}"><i class="bi bi-pencil"></i></button>
          <button class="btn btn-sm btn-outline-primary js-view-history" data-id="${i.rental_item_id}"><i class="bi bi-clock-history"></i></button>
          <button class="btn btn-sm btn-outline-danger js-delete-item" data-id="${i.rental_item_id}"><i class="bi bi-trash"></i></button>
        </td>
      </tr>`);
  });

  const attention = items.filter(i => ["Damaged", "Under Maintenance", "Missing"].includes(i.status));
  const $att = $('#attentionBody').empty();
  if (!attention.length) {
    $att.append('<tr><td colspan="4" class="text-center text-muted py-3">Nothing needs attention.</td></tr>');
  }
  attention.forEach(i => {
    $att.append(`
      <tr>
        <td class="fw-semibold">${i.name}</td>
        <td>${i.item_code}</td>
        <td>${badgeStatus(i.status, CONFIG.inventoryStatusColors)}</td>
        <td class="text-muted">${i.notes || ''}</td>
      </tr>`);
  });
}
</script>
</body>
</html>
