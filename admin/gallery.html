<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gallery | Admin</title>
<link href="../vendor/fonts.css" rel="stylesheet">
<link href="../vendor/bootstrap-5.3.3.min.css" rel="stylesheet">
<link rel="stylesheet" href="../vendor/bootstrap-icons.css">
<link rel="stylesheet" href="../css/admin.css">
</head>
<body class="admin-body">

<div class="sidebar-backdrop" id="sidebarBackdrop"></div>
<aside class="admin-sidebar" id="adminSidebar"></aside>

<main class="admin-main">
  <div class="admin-topbar">
    <div class="d-flex align-items-center gap-2">
      <button class="btn btn-outline-secondary btn-sm d-none admin-mobile-toggle" id="sidebarToggleBtn" aria-label="Toggle admin navigation" aria-controls="adminSidebar" aria-expanded="false"><i class="bi bi-list"></i></button>
      <h1 id="adminPageTitle">Gallery</h1>
    </div>
    <button class="btn btn-admin-primary" id="addImageBtn"><i class="bi bi-plus-lg"></i> Add Image</button>
  </div>

  <div class="panel">
    <div class="row g-3" id="galleryGridAdmin"></div>
  </div>
</main>

<div class="modal fade" id="imageFormModal" tabindex="-1" aria-labelledby="imageFormTitle" aria-hidden="true">
  <div class="modal-dialog modal-dialog-scrollable">
    <form class="modal-content" id="imageForm">
      <div class="modal-header">
          <h5 class="modal-title" id="imageFormTitle">Add Image</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close image form"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="imgId">
          <div class="mb-3">
            <label class="form-label" for="imgTitle">Title</label>
            <input type="text" class="form-control" id="imgTitle" required>
          </div>
          <div class="mb-3">
            <label class="form-label" for="imgUrl">Image URL</label>
            <input type="text" inputmode="url" class="form-control" id="imgUrl" placeholder="https://... or /images/setup.jpg">
            <div class="form-text">Use an HTTP(S) URL or a path on this site, or select an image file below.</div>
          </div>
          <div class="mb-3">
            <label class="form-label" for="imgFile">Upload from your device</label>
            <input type="file" class="form-control" id="imgFile" accept="image/jpeg,image/png,image/gif,image/webp">
            <div class="form-text">JPG, PNG, GIF, or WebP; maximum 5 MB. Uploading requires a server connection.</div>
          </div>
          <div class="mb-3" id="imgPreviewWrap" hidden>
            <img id="imgPreview" alt="Selected gallery image preview" style="display:block;max-width:100%;max-height:200px;object-fit:contain;border-radius:8px;">
          </div>
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="imgFeatured">
            <label class="form-check-label" for="imgFeatured">Featured (shown on homepage)</label>
          </div>
        </div>
        <div id="imageFormError" class="alert alert-danger mx-3 mb-0" role="alert" hidden></div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-admin-primary">Save</button>
        </div>
      </form>
    </div>
  </div>

<script src="../vendor/jquery-3.7.1.min.js"></script>
<script src="../vendor/bootstrap-5.3.3.bundle.min.js"></script>
<script src="../js/config.js"></script>
<script src="../js/storage.js"></script>
<script src="../js/api.js"></script>
<script src="../js/sync.js"></script>
<script src="../js/admin.js"></script>
<script src="../js/sync-ui.js"></script>
<script src="../js/offline.js"></script>
<script>
adminReady(async function () {
  await API.ready;
  await initAdminChrome('gallery.html', 'Gallery');
  await renderGallery();

  const updateImagePreview = () => {
    const file = document.getElementById('imgFile').files[0];
    const image = document.getElementById('imgPreview');
    const wrap = document.getElementById('imgPreviewWrap');
    if (image.dataset.objectUrl) URL.revokeObjectURL(image.dataset.objectUrl);
    image.dataset.objectUrl = '';
    const source = file ? URL.createObjectURL(file) : safeGalleryImageUrl($('#imgUrl').val());
    if (!source) {
      image.removeAttribute('src');
      wrap.hidden = true;
      return;
    }
    image.src = source;
    if (file) image.dataset.objectUrl = source;
    wrap.hidden = false;
  };

  $('#addImageBtn').onAdmin('click', function () {
    $('#imageForm')[0].reset();
    $('#imgId').val('');
    $('#imageFormError').prop('hidden', true).text('');
    $('#imageFormTitle').text('Add Image');
    updateImagePreview();
    new bootstrap.Modal('#imageFormModal').show();
  });

  $('.admin-main').onAdmin('click', '.js-edit-img', async function (event) {
    const target = $(event.target).closest('.js-edit-img');
    if (!target.length) return;
    const img = (await API.getGallery()).find(g => g.image_id === target.data('id'));
    if (!img) return;
    $('#imgId').val(img.image_id);
    $('#imgTitle').val(img.title);
    $('#imgUrl').val(img.image);
    $('#imgFile').val('');
    $('#imgFeatured').prop('checked', !!img.featured);
    $('#imageFormError').prop('hidden', true).text('');
    $('#imageFormTitle').text('Edit Image');
    updateImagePreview();
    new bootstrap.Modal('#imageFormModal').show();
  });

  $('#imgFile').onAdmin('change', updateImagePreview);
  $('#imgUrl').onAdmin('input', function () {
    if (!document.getElementById('imgFile').files.length) updateImagePreview();
  });

  $('.admin-main').onAdmin('click', '.js-delete-img', async function (event) {
    const target = $(event.target).closest('.js-delete-img');
    if (!target.length) return;
    const id = target.data('id');
    return confirmDelete('Delete this gallery image?', async function () {
      await API.deleteGalleryImage(id);
      await renderGallery();
      showAdminToast('Image deleted', 'danger');
    });
  });

  $('#imageForm').onAdmin('submit', async function (e) {
    e.preventDefault();
    const id = $('#imgId').val();
    const file = document.getElementById('imgFile').files[0];
    const data = { title: $('#imgTitle').val().trim(), image: $('#imgUrl').val().trim(), featured: $('#imgFeatured').is(':checked') };
    if (!data.title) {
      $('#imageFormError').text('Enter a title for this image.').prop('hidden', false).trigger('focus');
      return;
    }
    if (file && !safeGalleryUploadFile(file)) {
      $('#imageFormError').text('Choose a JPG, PNG, GIF, or WebP image no larger than 5 MB.').prop('hidden', false).trigger('focus');
      return;
    }
    if (!file && !safeGalleryImageUrl(data.image)) {
      $('#imageFormError').text('Enter a valid HTTP or HTTPS image URL.').prop('hidden', false).trigger('focus');
      return;
    }
    try {
      if (file) data.image = await API.uploadGalleryImage(file);
      else data.image = safeGalleryImageUrl(data.image);
      if (id) { await API.updateGalleryImage(id, data); showAdminToast(API.savedMessage()); }
      else { await API.createGalleryImage(data); showAdminToast(API.savedMessage()); }
      bootstrap.Modal.getInstance(document.getElementById('imageFormModal')).hide();
      await renderGallery();
    } catch (error) {
      $('#imageFormError').text(error.message).prop('hidden', false).trigger('focus');
    }
  });

  document.getElementById('imageFormModal').addEventListener('hidden.bs.modal', function () {
    const image = document.getElementById('imgPreview');
    if (image.dataset.objectUrl) URL.revokeObjectURL(image.dataset.objectUrl);
    image.dataset.objectUrl = '';
    image.removeAttribute('src');
    document.getElementById('imgPreviewWrap').hidden = true;
  });
});

function safeGalleryUploadFile(file) {
  return file instanceof File &&
    ['image/jpeg', 'image/png', 'image/gif', 'image/webp'].includes(file.type) &&
    file.size > 0 && file.size <= 5 * 1024 * 1024;
}

function safeGalleryImageUrl(value) {
  if (typeof value !== 'string' || !value.trim()) return '';
  try {
    const url = new URL(value.trim(), window.location.href);
    return ['http:', 'https:'].includes(url.protocol) ? url.href : '';
  } catch (error) {
    return '';
  }
}

async function renderGallery() {
  const images = await API.getGallery();
  const $wrap = $('#galleryGridAdmin').empty();
  if (!images.length) {
    $wrap.append('<p class="text-muted">No images yet.</p>');
    return;
  }
  images.forEach(img => {
    $wrap.append(`
      <div class="col-md-4 col-sm-6">
        <div class="border rounded overflow-hidden">
          <img src="${escapeHtmlA(safeGalleryImageUrl(img.image))}" alt="${escapeHtmlA(img.title)}" style="width:100%;height:160px;object-fit:cover;">
          <div class="p-2">
            <div class="d-flex justify-content-between align-items-center">
              <span class="fw-semibold small">${escapeHtmlA(img.title)}</span>
              ${img.featured ? '<span class="badge bg-warning text-dark">Featured</span>' : ''}
            </div>
            <div class="mt-2 d-flex gap-1">
              <button class="btn btn-sm btn-outline-secondary js-edit-img" data-id="${escapeHtmlA(img.image_id)}" aria-label="Edit ${escapeHtmlA(img.title)}"><i class="bi bi-pencil"></i></button>
              <button class="btn btn-sm btn-outline-danger js-delete-img" data-id="${escapeHtmlA(img.image_id)}" aria-label="Delete ${escapeHtmlA(img.title)}"><i class="bi bi-trash"></i></button>
            </div>
          </div>
        </div>
      </div>`);
  });
}
</script>
</body>
</html>
