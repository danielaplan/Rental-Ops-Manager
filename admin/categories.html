<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Categories | Admin</title>
<link href="../vendor/fonts.css" rel="stylesheet">
<link href="../vendor/bootstrap-5.3.3.min.css" rel="stylesheet">
<link rel="stylesheet" href="../vendor/bootstrap-icons.css">
<link rel="stylesheet" href="../css/admin.css">
</head>
<body class="admin-body">

<div class="sidebar-backdrop" id="sidebarBackdrop"></div>
<aside class="admin-sidebar" id="adminSidebar"></aside>

<main class="admin-main">
  <div class="admin-topbar">
    <div class="d-flex align-items-center gap-2">
      <button class="btn btn-outline-secondary btn-sm d-none admin-mobile-toggle" id="sidebarToggleBtn"><i class="bi bi-list"></i></button>
      <h1 id="adminPageTitle">Categories</h1>
    </div>
    <button class="btn btn-admin-primary" id="addCategoryBtn"><i class="bi bi-plus-lg"></i> Add Category</button>
  </div>

  <div class="panel">
    <div class="table-wrap">
      <table class="admin-table">
        <thead><tr><th>Name</th><th># Services</th><th>Status</th><th>Actions</th></tr></thead>
        <tbody id="categoriesBody"></tbody>
      </table>
    </div>
  </div>
</main>

<div class="modal fade" id="categoryFormModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-scrollable">
    <form class="modal-content" id="categoryForm">
      <div class="modal-header">
          <h5 class="modal-title" id="categoryFormTitle">Add Category</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="catId">
          <div class="mb-3">
            <label class="form-label" for="catName">Category Name</label>
            <input type="text" class="form-control" id="catName" required>
          </div>
          <div class="mb-1">
            <label class="form-label" for="catStatus">Status</label>
            <select class="form-select" id="catStatus">
              <option>Active</option>
              <option>Inactive</option>
            </select>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-admin-primary">Save</button>
        </div>
      </form>
    </div>
  </div>

<script src="../vendor/jquery-3.7.1.min.js"></script>
<script src="../vendor/bootstrap-5.3.3.bundle.min.js"></script>
<script src="../js/config.js"></script>
<script src="../js/storage.js"></script>
<script src="../js/api.js"></script>
<script src="../js/sync.js"></script>
<script src="../js/admin.js"></script>
<script src="../js/sync-ui.js"></script>
<script src="../js/offline.js"></script>
<script>
adminReady(async function () {
  await API.ready;
  await initAdminChrome('categories.html', 'Categories');
  await renderCategoriesTable();

  $('#addCategoryBtn').onAdmin('click', function () {
    $('#categoryForm')[0].reset();
    $('#catId').val('');
    $('#categoryFormTitle').text('Add Category');
    new bootstrap.Modal('#categoryFormModal').show();
  });

  $(document).onAdmin('click', '.js-edit-cat', async function (event) {
    const target = $(event.target).closest('.js-edit-cat');
    if (!target.length) return;
    const categories = await API.getCategories();
    const c = categories.find(x => x.category_id === target.data('id'));
    if (!c) return;
    $('#catId').val(c.category_id);
    $('#catName').val(c.name);
    $('#catStatus').val(c.status);
    $('#categoryFormTitle').text('Edit Category');
    new bootstrap.Modal('#categoryFormModal').show();
  });

  $(document).onAdmin('click', '.js-delete-cat', async function (event) {
    const target = $(event.target).closest('.js-delete-cat');
    if (!target.length) return;
    const id = target.data('id');
    const services = await API.getServices();
    const inUse = services.some(s => s.category_id === id);
    if (inUse) { alert('This category is used by one or more services. Reassign those services first.'); return; }
    return confirmDelete('Delete this category?', async function () {
      try { await API.deleteCategory(id); await renderCategoriesTable(); showAdminToast(API.savedMessage()); }
      catch (error) { showAdminToast(error.message, 'danger'); }
    });
  });

  $('#categoryForm').onAdmin('submit', async function (e) {
    e.preventDefault();
    const id = $('#catId').val();
    const data = { name: $('#catName').val().trim(), status: $('#catStatus').val() };
    const submit = $(this).find('[type="submit"]').prop('disabled', true);
    try {
      if (id) await API.updateCategory(id, data);
      else await API.createCategory(data);
      bootstrap.Modal.getInstance(document.getElementById('categoryFormModal')).hide();
      await renderCategoriesTable();
      showAdminToast(API.savedMessage());
    } catch (error) { showAdminToast(error.message, 'danger'); }
    finally { submit.prop('disabled', false); }
  });
});

async function renderCategoriesTable() {
  const [categories, services] = await Promise.all([API.getCategories(), API.getServices()]);
  const $body = $('#categoriesBody').empty();
  if (!categories.length) {
    $body.append('<tr><td colspan="4" class="text-center text-muted py-4">No categories yet.</td></tr>');
    return;
  }
  categories.forEach(c => {
    const count = services.filter(s => s.category_id === c.category_id).length;
    $body.append(`
      <tr>
        <td class="fw-semibold">${escapeHtmlA(c.name)}</td>
        <td>${count}</td>
        <td>${badgeStatus(c.status, { Active: 'success', Inactive: 'secondary' })}</td>
        <td>
          <button class="btn btn-sm btn-outline-secondary js-edit-cat" data-id="${escapeHtmlA(c.category_id)}" aria-label="Edit ${escapeHtmlA(c.name)}"><i class="bi bi-pencil"></i></button>
          <button class="btn btn-sm btn-outline-danger js-delete-cat" data-id="${escapeHtmlA(c.category_id)}" aria-label="Delete ${escapeHtmlA(c.name)}"><i class="bi bi-trash"></i></button>
        </td>
      </tr>`);
  });
}
</script>
</body>
</html>
