<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Categories | Admin</title>
<link href="../vendor/fonts.css" rel="stylesheet">
<link href="../vendor/bootstrap-5.3.3.min.css" rel="stylesheet">
<link rel="stylesheet" href="../vendor/bootstrap-icons.css">
<link rel="stylesheet" href="../css/admin.css?v=20261031-readability-v1">
</head>
<body class="admin-body">

<div class="sidebar-backdrop" id="sidebarBackdrop"></div>
<aside class="admin-sidebar" id="adminSidebar"></aside>

<main class="admin-main">
  <div class="admin-topbar">
    <div class="d-flex align-items-center gap-2">
      <button class="btn btn-outline-secondary btn-sm d-none admin-mobile-toggle" id="sidebarToggleBtn" aria-label="Toggle admin navigation" aria-controls="adminSidebar" aria-expanded="false"><i class="bi bi-list"></i></button>
      <h1 id="adminPageTitle">Categories</h1>
    </div>
    <button class="btn btn-admin-primary" id="addCategoryBtn"><i class="bi bi-plus-lg"></i> Add Category</button>
  </div>

  <div class="panel">
    <div class="table-wrap">
      <table class="admin-table">
        <thead><tr><th>Name</th><th># Services</th><th>Status</th><th>Actions</th></tr></thead>
        <tbody id="categoriesBody"></tbody>
      </table>
    </div>
  </div>
</main>

<div class="modal fade" id="categoryFormModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-scrollable">
    <form class="modal-content" id="categoryForm">
      <div class="modal-header">
          <h2 class="modal-title h5" id="categoryFormTitle">Add Category</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close category form"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="catId">
          <div class="mb-3">
            <label class="form-label" for="catName">Category Name</label>
            <input type="text" class="form-control" id="catName" required>
          </div>
          <div class="mb-1">
            <label class="form-label" for="catStatus">Status</label>
            <select class="form-select" id="catStatus">
              <option>Active</option>
              <option>Inactive</option>
            </select>
          </div>
          <section class="mt-4" id="categoryServicesSection" aria-labelledby="categoryServicesTitle" hidden>
            <div class="d-flex align-items-center justify-content-between gap-2 mb-2">
              <h3 class="h6 mb-0" id="categoryServicesTitle">Services using this category</h3>
              <span class="badge text-bg-secondary" id="categoryServicesCount">0</span>
            </div>
            <div class="list-group" id="categoryServicesList"></div>
          </section>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-admin-primary">Save</button>
        </div>
      </form>
    </div>
  </div>

<script src="../vendor/jquery-3.7.1.min.js"></script>
<script src="../vendor/bootstrap-5.3.3.bundle.min.js"></script>
<script src="../js/config.js"></script>
<script src="../js/storage.js"></script>
<script src="../js/api.js"></script>
<script src="../js/sync.js"></script>
<script src="../vendor/lucide-1.65.0.min.js"></script>
<script src="../js/admin.js"></script>
<script src="../js/admin-icons.js?v=20261031-lucide-v2"></script>
<script src="../js/sync-ui.js"></script>
<script src="../js/offline.js"></script>
<script>
adminReady(async function () {
  await API.ready;
  await initAdminChrome('categories.html', 'Categories');
  await renderCategoriesTable(false);
  Promise.all([API.getCategories(), API.getServices()])
    .then(() => renderCategoriesTable(false))
    .catch(() => {});

  $('#addCategoryBtn').onAdmin('click', function () {
    $('#categoryForm')[0].reset();
    $('#catId').val('');
    $('#categoryServicesSection').prop('hidden', true);
    $('#categoryServicesList').empty();
    $('#categoryFormTitle').text('Add Category');
    new bootstrap.Modal('#categoryFormModal').show();
  });

  $('.admin-main').onAdmin('click', '.js-edit-cat', async function (event) {
    const target = $(event.target).closest('.js-edit-cat');
    if (!target.length) return;
    const categories = STORAGE.getAll('categories');
    const services = STORAGE.getAll('services');
    const c = categories.find(x => x.category_id === target.data('id'));
    if (!c) return;
    $('#catId').val(c.category_id);
    $('#catName').val(c.name);
    $('#catStatus').val(c.status);
    renderCategoryServices(c.category_id, services);
    $('#categoryFormTitle').text('Edit Category');
    new bootstrap.Modal('#categoryFormModal').show();
  });

  $('.admin-main').onAdmin('click', '.js-delete-cat', async function (event) {
    const target = $(event.target).closest('.js-delete-cat');
    if (!target.length) return;
    const id = target.data('id');
    const services = STORAGE.getAll('services');
    const inUse = services.some(s => String(resolveServiceCategoryId(s)) === String(id));
    if (inUse) { alert('This category is used by one or more services. Reassign those services first.'); return; }
    return confirmDelete('Delete this category?', async function () {
      try { await API.deleteCategory(id); await renderCategoriesTable(false); showAdminToast(API.savedMessage()); }
      catch (error) { showAdminToast(error.message, 'danger'); }
    });
  });

  $('#categoryForm').onAdmin('submit', async function (e) {
    e.preventDefault();
    const id = $('#catId').val();
    const data = { name: $('#catName').val().trim(), status: $('#catStatus').val() };
    const submit = $(this).find('[type="submit"]').prop('disabled', true);
    try {
      if (id) await API.updateCategory(id, data);
      else await API.createCategory(data);
      bootstrap.Modal.getInstance(document.getElementById('categoryFormModal')).hide();
      await renderCategoriesTable(false);
      showAdminToast(API.savedMessage());
    } catch (error) { showAdminToast(error.message, 'danger'); }
    finally { submit.prop('disabled', false); }
  });
});

async function renderCategoriesTable(refreshData = false) {
  const [categories, services] = refreshData
    ? await Promise.all([API.getCategories(), API.getServices()])
    : [STORAGE.getAll('categories'), STORAGE.getAll('services')];
  const $body = $('#categoriesBody').empty();
  if (!categories.length) {
    $body.append('<tr><td colspan="4" class="text-center text-muted py-4">No categories yet.</td></tr>');
    return;
  }
  categories.forEach(c => {
    const count = services.filter(s => s.status !== 'Inactive' && String(resolveServiceCategoryId(s)) === String(c.category_id)).length;
    $body.append(`
      <tr>
        <td class="fw-semibold">${escapeHtmlA(c.name)}</td>
        <td>${count}</td>
        <td>${badgeStatus(c.status, { Active: 'success', Inactive: 'secondary' })}</td>
        <td>
          <button class="btn btn-sm btn-outline-secondary js-edit-cat" data-id="${escapeHtmlA(c.category_id)}" aria-label="Edit ${escapeHtmlA(c.name)}"><i class="bi bi-pencil"></i></button>
          <button class="btn btn-sm btn-outline-danger js-delete-cat" data-id="${escapeHtmlA(c.category_id)}" aria-label="Delete ${escapeHtmlA(c.name)}"><i class="bi bi-trash"></i></button>
        </td>
      </tr>`);
  });
}

function renderCategoryServices(categoryId, services) {
  const matches = services.filter(service => String(resolveServiceCategoryId(service)) === String(categoryId));
  const $list = $('#categoryServicesList').empty();
  $('#categoryServicesCount').text(matches.length);
  if (!matches.length) {
    $list.append('<div class="list-group-item text-muted small">No services currently use this category.</div>');
  } else {
    matches
      .sort((a, b) => String(a.name || '').localeCompare(String(b.name || '')))
      .forEach(service => {
        const badgeClass = service.status === 'Active' ? 'text-bg-success' : 'text-bg-secondary';
        $list.append(`<div class="list-group-item d-flex align-items-center justify-content-between gap-3"><span>${escapeHtmlA(service.name || 'Unnamed service')}</span><span class="badge ${badgeClass}">${escapeHtmlA(service.status || 'Unknown')}</span></div>`);
      });
  }
  $('#categoryServicesSection').prop('hidden', false);
}
</script>
</body>
</html>
