<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Audit History | Admin</title>
<link href="../vendor/fonts.css" rel="stylesheet"><link href="../vendor/bootstrap-5.3.3.min.css" rel="stylesheet">
<link rel="stylesheet" href="../vendor/bootstrap-icons.css"><link rel="stylesheet" href="../css/admin.css?v=20261031-readability-v1">
</head>
<body class="admin-body">
<div class="sidebar-backdrop" id="sidebarBackdrop"></div><aside class="admin-sidebar" id="adminSidebar"></aside>
<main class="admin-main">
  <div class="admin-topbar"><div class="d-flex align-items-center gap-2"><button class="btn btn-outline-secondary btn-sm d-none admin-mobile-toggle" id="sidebarToggleBtn" aria-label="Toggle admin navigation" aria-controls="adminSidebar" aria-expanded="false"><i class="bi bi-list"></i></button><h1 id="adminPageTitle">Audit History</h1></div></div>
  <div class="panel mb-3">
    <div class="row g-3">
      <div class="col-sm-6 col-lg-3"><label class="form-label" for="auditOwner">Owner</label><select class="form-select" id="auditOwner"><option value="">All actors</option></select></div>
      <div class="col-sm-6 col-lg-3"><label class="form-label" for="auditAction">Action</label><input class="form-control" id="auditAction" placeholder="e.g. booking_created"></div>
      <div class="col-sm-6 col-lg-3"><label class="form-label" for="auditRecord">Record</label><input class="form-control" id="auditRecord" placeholder="e.g. booking or booking 10"></div>
      <div class="col-sm-6 col-lg-3"><label class="form-label" for="auditDate">Date</label><input type="date" class="form-control" id="auditDate"></div>
    </div>
  </div>
  <div class="panel"><div class="d-flex justify-content-between align-items-center mb-3"><div><div class="panel-title">Append-only activity</div><div class="small text-muted">Audit entries can be reviewed but cannot be edited or deleted.</div></div><span class="badge bg-light text-dark border" id="auditCount"></span></div>
    <div class="table-wrap"><table class="admin-table"><thead><tr><th>Date</th><th>Actor</th><th>Action</th><th>Record</th><th>Change</th><th>Description</th></tr></thead><tbody id="auditBody"></tbody></table></div>
  </div>
</main>
<script src="../vendor/jquery-3.7.1.min.js"></script><script src="../vendor/bootstrap-5.3.3.bundle.min.js"></script><script src="../js/config.js"></script><script src="../js/storage.js"></script><script src="../js/api.js"></script><script src="../js/sync.js"></script><script src="../js/bookings.js"></script><script src="../vendor/lucide-1.65.0.min.js"></script><script src="../js/admin.js"></script><script src="../js/admin-icons.js?v=20261031-lucide-v2"></script><script src="../js/sync-ui.js"></script><script src="../js/offline.js"></script>
<script>
let auditRows = [];
adminReady(async function () {
  await API.ready; await initAdminChrome('audit.html', 'Audit History');
  try {
    auditRows = await API.getAuditLogs();
    const actors=[...new Map(auditRows.filter(row=>row.user_id).map(row=>[String(row.user_id),row.actor_name||`Owner ${row.user_id}`])).entries()];
    actors.forEach(([id,name]) => $('#auditOwner').append(`<option value="${id}">${escapeHtmlA(name)}</option>`));
    renderAudit();
  } catch (error) { $('#auditBody').html(`<tr><td colspan="6" class="text-center text-danger py-4">${escapeHtmlA(error.message)}</td></tr>`); }
  $('#auditOwner,#auditAction,#auditRecord,#auditDate').onAdmin('input change', renderAudit);
});
function renderAudit() {
  const actor = $('#auditOwner').val(), action = $('#auditAction').val().trim().toLowerCase(), record = $('#auditRecord').val().trim().toLowerCase(), date = $('#auditDate').val();
  const rows = auditRows.filter(row => (!actor || String(row.user_id) === actor) && (!action || String(row.action).toLowerCase().includes(action)) && (!record || `${row.record_type} ${row.record_id}`.toLowerCase().includes(record)) && (!date || String(row.created_at).slice(0,10) === date));
  $('#auditCount').text(`${rows.length} entr${rows.length === 1 ? 'y' : 'ies'}`);
  const body = $('#auditBody').empty();
  if (!rows.length) return body.append('<tr><td colspan="6" class="text-center text-muted py-4">No audit entries match these filters.</td></tr>');
  rows.slice().reverse().forEach(row => body.append(`<tr><td>${escapeHtmlA(row.created_at)}</td><td>${escapeHtmlA(row.actor_name || row.origin)}</td><td>${escapeHtmlA(row.action)}</td><td>${escapeHtmlA(row.record_type)} #${escapeHtmlA(row.record_id)}</td><td>${escapeHtmlA(row.old_status || '—')} → ${escapeHtmlA(row.new_status || '—')}</td><td>${escapeHtmlA(row.description)}</td></tr>`));
}
</script></body></html>
