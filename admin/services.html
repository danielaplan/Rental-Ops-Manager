<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Services | Admin</title>
<link href="../vendor/fonts.css" rel="stylesheet">
<link href="../vendor/bootstrap-5.3.3.min.css" rel="stylesheet">
<link rel="stylesheet" href="../vendor/bootstrap-icons.css">
<link rel="stylesheet" href="../css/admin.css">
</head>
<body class="admin-body">

<div class="sidebar-backdrop" id="sidebarBackdrop"></div>
<aside class="admin-sidebar" id="adminSidebar"></aside>

<main class="admin-main">
  <div class="admin-topbar">
    <div class="d-flex align-items-center gap-2">
      <button class="btn btn-outline-secondary btn-sm d-none admin-mobile-toggle" id="sidebarToggleBtn"><i class="bi bi-list"></i></button>
      <h1 id="adminPageTitle">Services</h1>
    </div>
    <button class="btn btn-admin-primary" id="addServiceBtn"><i class="bi bi-plus-lg"></i> Add Service</button>
  </div>

  <div class="panel">
    <div class="table-wrap">
      <table class="admin-table">
        <thead><tr>
          <th>Service</th><th>Description</th><th>Status</th><th>Actions</th>
        </tr></thead>
        <tbody id="servicesBody"></tbody>
      </table>
    </div>
  </div>
</main>

<!-- ADD/EDIT MODAL -->
<div class="modal fade" id="serviceFormModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-scrollable">
    <form class="modal-content" id="serviceForm">
      <div class="modal-header">
        <h5 class="modal-title" id="serviceFormTitle">Add Service</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="svcId">
        <div class="row g-3">
          <div class="col-12">
            <label class="form-label" for="svcName">Service Name</label>
            <input type="text" class="form-control" id="svcName" required>
          </div>
          <div class="col-12">
            <label class="form-label" for="svcDescription">Description</label>
            <textarea class="form-control" id="svcDescription" rows="2" required></textarea>
          </div>
          <div class="col-md-6">
            <label class="form-label" for="svcStatus">Status</label>
            <select class="form-select" id="svcStatus">
              <option value="Active">Active</option>
              <option value="Inactive">Inactive</option>
            </select>
            <div class="form-text" id="svcInactiveCreateNote" hidden>New services must be created as Active until the server reliably saves an Inactive status.</div>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="submit" class="btn btn-admin-primary">Save Service</button>
      </div>
    </form>
  </div>
</div>

<script src="../vendor/jquery-3.7.1.min.js"></script>
<script src="../vendor/bootstrap-5.3.3.bundle.min.js"></script>
<script src="../js/config.js"></script>
<script src="../js/storage.js"></script>
<script src="../js/api.js"></script>
<script src="../js/sync.js"></script>
<script src="../js/bookings.js"></script>
<script src="../js/admin.js"></script>
<script src="../js/sync-ui.js"></script>
<script src="../js/offline.js"></script>
<script>
adminReady(async function () {
  await API.ready;
  await initAdminChrome('services.html', 'Services');
  await renderServicesTable();

  $('#addServiceBtn').onAdmin('click', function () {
    $('#serviceForm')[0].reset();
    $('#svcId').val('');
    $('#serviceFormTitle').text('Add Service');
    $('#svcStatus option[value="Inactive"]').prop('disabled', true);
    $('#svcStatus').val('Active');
    $('#svcInactiveCreateNote').prop('hidden', false);
    new bootstrap.Modal('#serviceFormModal').show();
  });

  $(document).onAdmin('click', '.js-edit-service', async function (event) {
    const target = $(event.target).closest('.js-edit-service');
    if (!target.length) return;
    const s = (await API.getServices()).find(item => item.service_id === target.data('id'));
    if (!s) return;
    $('#svcId').val(s.service_id);
    $('#svcName').val(s.name);
    $('#svcDescription').val(s.description);
    $('#svcStatus option[value="Inactive"]').prop('disabled', false);
    $('#svcInactiveCreateNote').prop('hidden', true);
    $('#svcStatus').val(s.status);
    $('#serviceFormTitle').text('Edit Service');
    new bootstrap.Modal('#serviceFormModal').show();
  });

  $(document).onAdmin('click', '.js-delete-service', async function (event) {
    const target = $(event.target).closest('.js-delete-service');
    if (!target.length) return;
    const id = target.data('id');
    return confirmDelete('Delete this service? Existing bookings and inventory may still refer to it.', async function () {
      try {
        await API.deleteService(id);
        await renderServicesTable();
        showAdminToast(API.savedMessage());
      } catch (error) {
        showAdminToast(error.message, 'danger');
      }
    });
  });

  $(document).onAdmin('change', '.js-toggle-service-status', async function (event) {
    const target = $(event.target).closest('.js-toggle-service-status');
    if (!target.length) return;
    const id = target.data('id');
    try {
      await API.updateService(id, { status: target.is(':checked') ? 'Active' : 'Inactive' });
      showAdminToast(API.savedMessage());
    } catch (error) {
      target.prop('checked', !target.is(':checked'));
      showAdminToast(error.message, 'danger');
    }
  });

  $('#serviceForm').onAdmin('submit', async function (e) {
    e.preventDefault();
    const id = $('#svcId').val();
    const data = { name: $('#svcName').val().trim(), description: $('#svcDescription').val().trim(), status: $('#svcStatus').val() };
    const submit = $(this).find('[type="submit"]').prop('disabled', true);
    try {
      if (id) await API.updateService(id, data);
      else await API.createService(data);
      bootstrap.Modal.getInstance(document.getElementById('serviceFormModal')).hide();
      await renderServicesTable();
      showAdminToast(API.savedMessage());
    } catch (error) {
      showAdminToast(error.message, 'danger');
    } finally {
      submit.prop('disabled', false);
    }
  });
});

async function renderServicesTable() {
  const services = await API.getServices();
  const $body = $('#servicesBody').empty();
  if (!services.length) {
    $body.append('<tr><td colspan="4" class="text-center text-muted py-4">No services yet. Add your first one.</td></tr>');
    return;
  }
  services.forEach(s => {
    $body.append(`
      <tr>
        <td class="fw-semibold">${escapeHtmlA(s.name)}${s.pending_sync ? '<span class="badge bg-warning text-dark ms-2">Pending Sync</span>' : ''}</td>
        <td>${escapeHtmlA(s.description || '')}</td>
        <td>
          <div class="form-check form-switch">
            <input class="form-check-input js-toggle-service-status" type="checkbox" aria-label="Service active status" data-id="${escapeHtmlA(s.service_id)}" ${s.status === 'Active' ? 'checked' : ''}>
          </div>
        </td>
        <td>
          <button class="btn btn-sm btn-outline-secondary js-edit-service" data-id="${escapeHtmlA(s.service_id)}" aria-label="Edit ${escapeHtmlA(s.name)}"><i class="bi bi-pencil"></i></button>
          <button class="btn btn-sm btn-outline-danger js-delete-service" data-id="${escapeHtmlA(s.service_id)}" aria-label="Delete ${escapeHtmlA(s.name)}"><i class="bi bi-trash"></i></button>
        </td>
      </tr>`);
  });
}
</script>
</body>
</html>
