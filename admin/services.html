<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Services | Admin</title>
<link href="../vendor/fonts.css" rel="stylesheet">
<link href="../vendor/bootstrap-5.3.3.min.css" rel="stylesheet">
<link rel="stylesheet" href="../vendor/bootstrap-icons.css">
<link rel="stylesheet" href="../css/admin.css">
</head>
<body class="admin-body">

<div class="sidebar-backdrop" id="sidebarBackdrop"></div>
<aside class="admin-sidebar" id="adminSidebar"></aside>

<main class="admin-main">
  <div class="admin-topbar">
    <div class="d-flex align-items-center gap-2">
      <button class="btn btn-outline-secondary btn-sm d-none admin-mobile-toggle" id="sidebarToggleBtn" aria-label="Toggle admin navigation" aria-controls="adminSidebar" aria-expanded="false"><i class="bi bi-list"></i></button>
      <h1 id="adminPageTitle">Services</h1>
    </div>
    <button class="btn btn-admin-primary" id="addServiceBtn"><i class="bi bi-plus-lg"></i> Add Service</button>
  </div>

  <div class="panel">
    <div class="table-wrap">
      <table class="admin-table">
        <thead><tr>
          <th>Service</th><th>Category</th><th>Description</th><th>Preparation</th><th>Travel</th><th>Status</th><th>Actions</th>
        </tr></thead>
        <tbody id="servicesBody"></tbody>
      </table>
    </div>
  </div>
</main>

<!-- ADD/EDIT MODAL -->
<div class="modal fade" id="serviceFormModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-scrollable">
    <form class="modal-content" id="serviceForm">
      <div class="modal-header">
        <h5 class="modal-title" id="serviceFormTitle">Add Service</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close service form"></button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="svcId">
        <div class="row g-3">
          <div class="col-12">
            <label class="form-label" for="svcName">Service Name</label>
            <input type="text" class="form-control" id="svcName" required>
          </div>
          <div class="col-12">
            <label class="form-label" for="svcCategory">Category</label>
            <select class="form-select" id="svcCategory" required>
              <option value="">Select a category</option>
            </select>
            <div class="form-text">Categories are managed from the Categories page.</div>
          </div>
          <div class="col-12">
            <label class="form-label" for="svcDescription">Description</label>
            <textarea class="form-control" id="svcDescription" rows="2" required></textarea>
          </div>
          <div class="col-12">
            <label class="form-label" for="svcImage">Public service image URL (optional)</label>
            <input type="text" class="form-control" id="svcImage">
            <div class="form-text">For a new service, save and sync it first, then edit it to add its public image.</div>
          </div>
          <div class="col-md-6">
            <label class="form-label" for="svcPreparation">Default preparation (minutes)</label>
            <input type="number" min="0" step="1" class="form-control" id="svcPreparation" value="0" required>
          </div>
          <div class="col-md-6">
            <label class="form-label" for="svcTravel">Default travel (minutes)</label>
            <input type="number" min="0" step="1" class="form-control" id="svcTravel" value="0" required>
          </div>
          <div class="col-md-6">
            <label class="form-label" for="svcStatus">Status</label>
            <select class="form-select" id="svcStatus">
              <option value="Active">Active</option>
              <option value="Inactive">Inactive</option>
            </select>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="submit" class="btn btn-admin-primary">Save Service</button>
      </div>
    </form>
  </div>
</div>

<script src="../vendor/jquery-3.7.1.min.js"></script>
<script src="../vendor/bootstrap-5.3.3.bundle.min.js"></script>
<script src="../js/config.js"></script>
<script src="../js/storage.js"></script>
<script src="../js/api.js"></script>
<script src="../js/sync.js"></script>
<script src="../js/bookings.js"></script>
<script src="../js/admin.js"></script>
<script src="../js/sync-ui.js"></script>
<script src="../js/offline.js"></script>
<script>
adminReady(async function () {
  await API.ready;
  await initAdminChrome('services.html', 'Services');
  await populateServiceCategories();
  await renderServicesTable();
  const refreshImage = attachAdminImageUpload('svcImage');

  $('#addServiceBtn').onAdmin('click', async function () {
    $('#serviceForm')[0].reset();
    $('#svcId').val('');
    $('#serviceFormTitle').text('Add Service');
    $('#svcStatus').val('Active');
    $('#svcPreparation, #svcTravel').val(0);
    await populateServiceCategories();
    new bootstrap.Modal('#serviceFormModal').show();
  });

  $('.admin-main').onAdmin('click', '.js-edit-service', async function (event) {
    const target = $(event.target).closest('.js-edit-service');
    if (!target.length) return;
    const s = (await API.getServices()).find(item => item.service_id === target.data('id'));
    if (!s) return;
    await populateServiceCategories(s.category_id);
    $('#svcId').val(s.service_id);
    const content = await API.getWebsiteContent();
    $('#svcImage').val(content.service_images?.[s.service_id] || '');
    refreshImage();
    $('#svcName').val(s.name);
    $('#svcCategory').val(s.category_id || '');
    $('#svcDescription').val(s.description);
    $('#svcStatus').val(s.status);
    $('#svcPreparation').val(s.default_preparation_minutes || 0);
    $('#svcTravel').val(s.default_travel_minutes || 0);
    $('#serviceFormTitle').text('Edit Service');
    new bootstrap.Modal('#serviceFormModal').show();
  });

  $('.admin-main').onAdmin('click', '.js-delete-service', async function (event) {
    const target = $(event.target).closest('.js-delete-service');
    if (!target.length) return;
    const id = target.data('id');
    return confirmDelete('Delete this service? Existing bookings and inventory may still refer to it.', async function () {
      try {
        await API.deleteService(id);
        await renderServicesTable();
        showAdminToast(API.savedMessage());
      } catch (error) {
        showAdminToast(error.message, 'danger');
      }
    });
  });

  $('.admin-main').onAdmin('change', '.js-toggle-service-status', async function (event) {
    const target = $(event.target).closest('.js-toggle-service-status');
    if (!target.length) return;
    const id = target.data('id');
    try {
      await API.updateService(id, { status: target.is(':checked') ? 'Active' : 'Inactive' });
      showAdminToast(API.savedMessage());
    } catch (error) {
      target.prop('checked', !target.is(':checked'));
      showAdminToast(error.message, 'danger');
    }
  });

  $('#serviceForm').onAdmin('submit', async function (e) {
    e.preventDefault();
    const id = $('#svcId').val();
    const data = {
      name: $('#svcName').val().trim(), category_id: $('#svcCategory').val(), description: $('#svcDescription').val().trim(), status: $('#svcStatus').val(),
      default_preparation_minutes: Number($('#svcPreparation').val()), default_travel_minutes: Number($('#svcTravel').val())
    };
    const submit = $(this).find('[type="submit"]').prop('disabled', true);
    try {
      if ($('#svcImage').val().trim() && (!id || String(id).startsWith('LOCAL-'))) {
        throw new Error('Save the service and finish syncing it first, then edit it to add an image.');
      }
      const image = $('#svcImage').val().trim();
      const content = await API.getWebsiteContent();
      const changedImage = image !== (content.service_images?.[id] || '');
      const saved = id ? await API.updateService(id, data) : await API.createService(data);
      // Keep the created ID if the separate image save fails, allowing a safe retry.
      $('#svcId').val(saved.service_id);
      if (changedImage) {
        const latest = await API.getWebsiteContent();
        await API.updateWebsiteContent({ ...latest, service_images: { ...latest.service_images, [saved.service_id]: image } });
      }
      bootstrap.Modal.getInstance(document.getElementById('serviceFormModal')).hide();
      await renderServicesTable();
      showAdminToast(API.savedMessage());
    } catch (error) {
      showAdminToast(error.message, 'danger');
    } finally {
      submit.prop('disabled', false);
    }
  });
});

async function renderServicesTable() {
  const [services, categories] = await Promise.all([API.getServices(), API.getCategories()]);
  const categoryNames = new Map(categories.map(category => [String(category.category_id), category.name]));
  const $body = $('#servicesBody').empty();
  if (!services.length) {
    $body.append('<tr><td colspan="7" class="text-center text-muted py-4">No services yet. Add your first one.</td></tr>');
    return;
  }
  services.forEach(s => {
    $body.append(`
      <tr>
        <td class="fw-semibold">${escapeHtmlA(s.name)}${s.pending_sync ? '<span class="badge bg-warning text-dark ms-2">Pending Sync</span>' : ''}</td>
        <td>${s.category_id ? escapeHtmlA(categoryNames.get(String(s.category_id)) || 'Unknown category') : '<span class="text-muted">Unassigned</span>'}</td>
        <td>${escapeHtmlA(s.description || '')}</td>
        <td>${Number(s.default_preparation_minutes || 0)} min</td>
        <td>${Number(s.default_travel_minutes || 0)} min</td>
        <td>
          <div class="form-check form-switch">
            <input class="form-check-input js-toggle-service-status" type="checkbox" aria-label="Service active status" data-id="${escapeHtmlA(s.service_id)}" ${s.status === 'Active' ? 'checked' : ''}>
          </div>
        </td>
        <td>
          <button class="btn btn-sm btn-outline-secondary js-edit-service" data-id="${escapeHtmlA(s.service_id)}" aria-label="Edit ${escapeHtmlA(s.name)}"><i class="bi bi-pencil"></i></button>
          <button class="btn btn-sm btn-outline-danger js-delete-service" data-id="${escapeHtmlA(s.service_id)}" aria-label="Delete ${escapeHtmlA(s.name)}"><i class="bi bi-trash"></i></button>
        </td>
      </tr>`);
  });
}

async function populateServiceCategories(selectedId = '') {
  const categories = await API.getCategories();
  const selected = String(selectedId || '');
  const $select = $('#svcCategory').empty().append('<option value="">Select a category</option>');
  categories.forEach(category => {
    if (category.status !== 'Active' && String(category.category_id) !== selected) return;
    const inactiveLabel = category.status === 'Active' ? '' : ' (Inactive)';
    $select.append(`<option value="${escapeHtmlA(category.category_id)}">${escapeHtmlA(category.name + inactiveLabel)}</option>`);
  });
  $select.val(selected);
  if (!selected && $select.find('option').length === 2) $select.prop('selectedIndex', 1);
}
</script>
</body>
</html>
