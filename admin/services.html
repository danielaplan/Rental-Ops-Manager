<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Services | Admin</title>
<link href="../vendor/fonts.css" rel="stylesheet">
<link href="../vendor/bootstrap-5.3.3.min.css" rel="stylesheet">
<link rel="stylesheet" href="../vendor/bootstrap-icons.css">
<link rel="stylesheet" href="../css/admin.css">
</head>
<body class="admin-body">

<div class="sidebar-backdrop" id="sidebarBackdrop"></div>
<aside class="admin-sidebar" id="adminSidebar"></aside>

<main class="admin-main">
  <div class="admin-topbar">
    <div class="d-flex align-items-center gap-2">
      <button class="btn btn-outline-secondary btn-sm d-none admin-mobile-toggle" id="sidebarToggleBtn"><i class="bi bi-list"></i></button>
      <h1 id="adminPageTitle">Services</h1>
    </div>
    <button class="btn btn-admin-primary" id="addServiceBtn"><i class="bi bi-plus-lg"></i> Add Service</button>
  </div>

  <div class="panel">
    <div class="table-wrap">
      <table class="admin-table">
        <thead><tr>
          <th>Image</th><th>Name</th><th>Category</th><th>Price</th><th>Featured</th><th>Status</th><th>Actions</th>
        </tr></thead>
        <tbody id="servicesBody"></tbody>
      </table>
    </div>
  </div>
</main>

<!-- ADD/EDIT MODAL -->
<div class="modal fade" id="serviceFormModal" tabindex="-1">
  <div class="modal-dialog modal-lg modal-dialog-scrollable">
    <form class="modal-content" id="serviceForm">
      <div class="modal-header">
        <h5 class="modal-title" id="serviceFormTitle">Add Service</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="svcId">
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label" for="svcName">Service Name</label>
            <input type="text" class="form-control" id="svcName" required>
          </div>
          <div class="col-md-6">
            <label class="form-label" for="svcCategory">Category</label>
            <select class="form-select" id="svcCategory" required></select>
          </div>
          <div class="col-12">
            <label class="form-label" for="svcDescription">Description</label>
            <textarea class="form-control" id="svcDescription" rows="2" required></textarea>
          </div>
          <div class="col-md-4">
            <label class="form-label" for="svcPrice">Price (₱)</label>
            <input type="number" min="0" class="form-control" id="svcPrice" required>
          </div>
          <div class="col-md-8">
            <label class="form-label" for="svcPriceLabel">Price Label</label>
            <input type="text" class="form-control" id="svcPriceLabel" placeholder="e.g. per event (up to 4 hrs)">
          </div>
          <div class="col-12">
            <label class="form-label" for="svcImage">Image URL</label>
            <input type="text" class="form-control" id="svcImage" placeholder="https://...">
          </div>
          <div class="col-12">
            <label class="form-label" for="svcInclusions">Inclusions (one per line)</label>
            <textarea class="form-control" id="svcInclusions" rows="3" placeholder="Karaoke machine&#10;2 wireless microphones"></textarea>
          </div>
          <div class="col-md-6">
            <div class="form-check mt-4">
              <input class="form-check-input" type="checkbox" id="svcFeatured">
              <label class="form-check-label" for="svcFeatured">Mark as Featured / Popular</label>
            </div>
          </div>
          <div class="col-md-6">
            <label class="form-label" for="svcStatus">Status</label>
            <select class="form-select" id="svcStatus">
              <option>Active</option>
              <option>Inactive</option>
            </select>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="submit" class="btn btn-admin-primary">Save Service</button>
      </div>
    </form>
  </div>
</div>

<script src="../vendor/jquery-3.7.1.min.js"></script>
<script src="../vendor/bootstrap-5.3.3.bundle.min.js"></script>
<script src="../js/config.js"></script>
<script src="../js/storage.js"></script>
<script src="../js/api.js"></script>
<script src="../js/sync.js"></script>
<script src="../js/bookings.js"></script>
<script src="../js/admin.js"></script>
<script src="../js/sync-ui.js"></script>
<script src="../js/offline.js"></script>
<script>
$(async function () {
  await API.ready;
  initAdminChrome('services.html', 'Services');
  populateCategorySelect();
  renderServicesTable();

  $('#addServiceBtn').on('click', function () {
    $('#serviceForm')[0].reset();
    $('#svcId').val('');
    $('#serviceFormTitle').text('Add Service');
    new bootstrap.Modal('#serviceFormModal').show();
  });

  $(document).on('click', '.js-edit-service', function () {
    const s = API.getService($(this).data('id'));
    if (!s) return;
    $('#svcId').val(s.service_id);
    $('#svcName').val(s.name);
    $('#svcCategory').val(s.category_id);
    $('#svcDescription').val(s.description);
    $('#svcPrice').val(s.price);
    $('#svcPriceLabel').val(s.price_label);
    $('#svcImage').val(s.image);
    $('#svcInclusions').val((s.inclusions || []).join('\n'));
    $('#svcFeatured').prop('checked', !!s.featured);
    $('#svcStatus').val(s.status);
    $('#serviceFormTitle').text('Edit Service');
    new bootstrap.Modal('#serviceFormModal').show();
  });

  $(document).on('click', '.js-delete-service', function () {
    const id = $(this).data('id');
    confirmDelete('Delete this service? Its add-ons and rental items will remain but be unlinked.', function () {
      API.deleteService(id);
      renderServicesTable();
      showAdminToast('Service deleted', 'danger');
    });
  });

  $(document).on('change', '.js-toggle-service-status', function () {
    const id = $(this).data('id');
    API.updateService(id, { status: this.checked ? 'Active' : 'Inactive' });
    showAdminToast('Service status updated');
  });

  $('#serviceForm').on('submit', function (e) {
    e.preventDefault();
    const id = $('#svcId').val();
    const data = {
      name: $('#svcName').val().trim(),
      category_id: $('#svcCategory').val(),
      description: $('#svcDescription').val().trim(),
      price: Number($('#svcPrice').val()),
      price_label: $('#svcPriceLabel').val().trim(),
      image: $('#svcImage').val().trim() || 'https://images.unsplash.com/photo-1530103862676-de8c9debad1d?w=800&q=80',
      inclusions: $('#svcInclusions').val().split('\n').map(s => s.trim()).filter(Boolean),
      featured: $('#svcFeatured').is(':checked'),
      status: $('#svcStatus').val()
    };
    if (id) { API.updateService(id, data); showAdminToast('Service updated'); }
    else { API.createService(data); showAdminToast('Service added'); }
    bootstrap.Modal.getInstance(document.getElementById('serviceFormModal')).hide();
    renderServicesTable();
  });
});

function populateCategorySelect() {
  const $sel = $('#svcCategory').empty();
  API.getCategories().forEach(c => $sel.append(`<option value="${c.category_id}">${c.name}</option>`));
}

function renderServicesTable() {
  const services = API.getServices();
  const categories = API.getCategories();
  const $body = $('#servicesBody').empty();
  if (!services.length) {
    $body.append('<tr><td colspan="7" class="text-center text-muted py-4">No services yet. Add your first one.</td></tr>');
    return;
  }
  services.forEach(s => {
    const cat = categories.find(c => c.category_id === s.category_id);
    $body.append(`
      <tr>
        <td><img src="${s.image}" style="width:56px;height:40px;object-fit:cover;border-radius:4px;"></td>
        <td class="fw-semibold">${s.name}</td>
        <td>${cat ? cat.name : '<span class="text-muted">Uncategorized</span>'}</td>
        <td>${BookingCalc.formatCurrency(s.price)}</td>
        <td>${s.featured ? '<span class="badge bg-warning text-dark">Featured</span>' : '—'}</td>
        <td>
          <div class="form-check form-switch">
            <input class="form-check-input js-toggle-service-status" type="checkbox" data-id="${s.service_id}" ${s.status === 'Active' ? 'checked' : ''}>
          </div>
        </td>
        <td>
          <button class="btn btn-sm btn-outline-secondary js-edit-service" data-id="${s.service_id}"><i class="bi bi-pencil"></i></button>
          <button class="btn btn-sm btn-outline-danger js-delete-service" data-id="${s.service_id}"><i class="bi bi-trash"></i></button>
        </td>
      </tr>`);
  });
}
</script>
</body>
</html>
