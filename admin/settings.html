<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Settings | Admin</title>
<link href="../vendor/fonts.css" rel="stylesheet">
<link href="../vendor/bootstrap-5.3.3.min.css" rel="stylesheet">
<link rel="stylesheet" href="../vendor/bootstrap-icons.css">
<link rel="stylesheet" href="../css/admin.css">
</head>
<body class="admin-body">

<div class="sidebar-backdrop" id="sidebarBackdrop"></div>
<aside class="admin-sidebar" id="adminSidebar"></aside>

<main class="admin-main">
  <div class="admin-topbar">
    <div class="d-flex align-items-center gap-2">
      <button class="btn btn-outline-secondary btn-sm d-none admin-mobile-toggle" id="sidebarToggleBtn" aria-label="Toggle admin navigation" aria-controls="adminSidebar" aria-expanded="false"><i class="bi bi-list"></i></button>
      <h1 id="adminPageTitle">Settings</h1>
    </div>
  </div>

  <form id="settingsForm">
    <div class="panel">
      <div class="panel-title">Business Settings</div>
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label" for="sBusinessName">Business Name</label>
          <input type="text" class="form-control" id="sBusinessName">
        </div>
        <div class="col-md-6">
          <label class="form-label" for="sLogo">Business logo — URL or upload</label>
          <input type="text" class="form-control" id="sLogo" aria-describedby="sLogoHelp">
          <div class="form-text" id="sLogoHelp">Paste an image URL or choose a logo from your device below. After uploading, click Save Settings to publish it.</div>
        </div>
        <div class="col-md-6">
          <label class="form-label" for="sPhone">Phone</label>
          <input type="text" class="form-control" id="sPhone">
        </div>
        <div class="col-md-6">
          <label class="form-label" for="sEmail">Email</label>
          <input type="email" class="form-control" id="sEmail">
        </div>
        <div class="col-12">
          <label class="form-label" for="sAddress">Address</label>
          <input type="text" class="form-control" id="sAddress">
        </div>
        <div class="col-md-6">
          <label class="form-label" for="sFacebook">Facebook</label>
          <input type="text" class="form-control" id="sFacebook">
        </div>
        <div class="col-md-6">
          <label class="form-label" for="sInstagram">Instagram</label>
          <input type="text" class="form-control" id="sInstagram">
        </div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-title">Booking Settings</div>
      <div class="row g-3">
        <div class="col-md-4">
          <label class="form-label" for="sNoticeDays">Minimum Booking Notice (days)</label>
          <input type="number" min="0" class="form-control" id="sNoticeDays">
        </div>
        <div class="col-md-4">
          <label class="form-label" for="sHoursOpen">Booking Hours — Open</label>
          <input type="time" class="form-control" id="sHoursOpen">
        </div>
        <div class="col-md-4">
          <label class="form-label" for="sHoursClose">Booking Hours — Close</label>
          <input type="time" class="form-control" id="sHoursClose">
        </div>
        <div class="col-12">
          <label class="form-label" for="sCancelPolicy">Cancellation Policy</label>
          <textarea class="form-control" id="sCancelPolicy" rows="3"></textarea>
        </div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-title">Appearance</div>
      <p class="text-muted small">Keep the site to 2–3 main colors for a clean, professional look.</p>
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label" for="sPrimaryColor">Primary Color</label>
          <input type="color" class="form-control form-control-color" id="sPrimaryColor">
        </div>
        <div class="col-md-6">
          <label class="form-label" for="sAccentColor">Accent Color</label>
          <input type="color" class="form-control form-control-color" id="sAccentColor">
        </div>
      </div>
      <div class="d-flex flex-wrap align-items-center gap-2 mt-3">
        <button type="button" class="btn btn-sm btn-outline-secondary" id="resetThemeBtn"><i class="bi bi-arrow-counterclockwise"></i> Restore default colors</button>
        <span class="text-muted small" id="themePreviewStatus" role="status" aria-live="polite">Changes preview instantly. Save Settings to publish them.</span>
      </div>
    </div>

    <button type="submit" class="btn btn-admin-primary px-4 py-2"><i class="bi bi-save"></i> Save Settings</button>
  </form>
</main>

<script src="../vendor/jquery-3.7.1.min.js"></script>
<script src="../vendor/bootstrap-5.3.3.bundle.min.js"></script>
<script src="../js/config.js"></script>
<script src="../js/storage.js"></script>
<script src="../js/api.js"></script>
<script src="../js/sync.js"></script>
<script src="../js/admin.js"></script>
<script src="../js/sync-ui.js"></script>
<script src="../js/offline.js"></script>
<script>
adminReady(async function () {
  attachAdminImageUpload('sLogo');
  await API.ready;
  await initAdminChrome('settings.html', 'Settings');
  await API.refreshSettings();
  await renderAdminSidebar('settings.html');
  await loadSettings();
  document.getElementById('sLogo').dispatchEvent(new Event('input'));

  $('#sPrimaryColor, #sAccentColor').onAdmin('input', function () {
    applyAdminAppearance({ primary_color: $('#sPrimaryColor').val(), accent_color: $('#sAccentColor').val() });
    $('#themePreviewStatus').text('Previewing your selected colors. Save Settings to publish them.');
  });

  $('#resetThemeBtn').onAdmin('click', function () {
    const defaults = CONFIG.themeDefaults;
    $('#sPrimaryColor').val(defaults.primary);
    $('#sAccentColor').val(defaults.accent);
    applyAdminAppearance({ primary_color: defaults.primary, accent_color: defaults.accent });
    $('#themePreviewStatus').text('Default colors selected. Click Save Settings to publish them.');
  });


  $('#settingsForm').onAdmin('submit', async function (e) {
    e.preventDefault();
    const submit = $(this).find('[type="submit"]').prop('disabled', true);
    try {
      const websiteContent = await API.getWebsiteContent();
      if ($('#sLogo').val().trim() !== (websiteContent.logo || '')) {
        await API.updateWebsiteContent({ ...websiteContent, logo: $('#sLogo').val().trim() });
      }
      const settings = {
        business_name: $('#sBusinessName').val().trim(),
        logo: $('#sLogo').val().trim(),
        phone: $('#sPhone').val().trim(),
        email: $('#sEmail').val().trim(),
        address: $('#sAddress').val().trim(),
        facebook: $('#sFacebook').val().trim(),
        instagram: $('#sInstagram').val().trim(),
        min_booking_notice_days: Number($('#sNoticeDays').val() || 0),
        booking_hours_open: $('#sHoursOpen').val(),
        booking_hours_close: $('#sHoursClose').val(),
        cancellation_policy: $('#sCancelPolicy').val().trim(),
        primary_color: $('#sPrimaryColor').val(),
        accent_color: $('#sAccentColor').val()
      };
      await API.updateSettings(settings);
      applyAdminAppearance(settings);
      $('#themePreviewStatus').text('Colors saved for the public website and admin interface.');
      showAdminToast(API.savedMessage());
    } catch (error) {
      showAdminToast(error.message, 'danger');
    } finally {
      submit.prop('disabled', false);
    }
  });
});

async function loadSettings() {
  const s = await API.getSettings().catch(() => ({}));
  const savedName = s.business_name || '';
  $('#sBusinessName').val(!savedName || savedName === CONFIG.businessNameFallback ? CONFIG.businessNameFallback : savedName);
  $('#sLogo').val(s.logo);
  $('#sPhone').val(s.phone);
  $('#sEmail').val(s.email);
  $('#sAddress').val(s.address);
  $('#sFacebook').val(s.facebook);
  $('#sInstagram').val(s.instagram);
  $('#sNoticeDays').val(s.min_booking_notice_days);
  $('#sHoursOpen').val(s.booking_hours_open);
  $('#sHoursClose').val(s.booking_hours_close);
  $('#sCancelPolicy').val(s.cancellation_policy);
  $('#sPrimaryColor').val(s.primary_color || CONFIG.themeDefaults.primary);
  $('#sAccentColor').val(s.accent_color || CONFIG.themeDefaults.accent);
  applyAdminAppearance(s);
}
</script>
</body>
</html>
